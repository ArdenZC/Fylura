  dependency-audit:
    name: Dependency audit
    needs: [source-evidence, validation-plan]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CARGO_AUDIT_VERSION: "0.22.2"
      CARGO_AUDIT_ROOT: ${{ github.workspace }}/.cargo-audit
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
      - name: npm audit
        run: npm run security:audit
      - name: Record Rust toolchain identity
        id: rust-toolchain
        shell: bash
        run: echo "rustc_identity=$(rustc -Vv | sha256sum | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - name: Cache pinned cargo-audit
        id: cargo-audit-cache
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: .cargo-audit
          key: fylura-cargo-audit-${{ runner.os }}-${{ runner.arch }}-${{ steps.rust-toolchain.outputs.rustc_identity }}-${{ env.CARGO_AUDIT_VERSION }}
      - name: Install pinned cargo-audit
        if: ${{ steps.cargo-audit-cache.outputs.cache-hit != 'true' }}
        shell: bash
        run: cargo install cargo-audit --version "$CARGO_AUDIT_VERSION" --locked --root "$CARGO_AUDIT_ROOT"
      - name: Verify pinned cargo-audit
        shell: bash
        run: |
          test -x "$CARGO_AUDIT_ROOT/bin/cargo-audit"
          "$CARGO_AUDIT_ROOT/bin/cargo-audit" --version | grep -F "$CARGO_AUDIT_VERSION"
          echo "$CARGO_AUDIT_ROOT/bin" >> "$GITHUB_PATH"
      - name: RustSec audit
        run: npm run security:audit:rust

  package-windows:
    name: Package NSIS
    needs: [source-evidence, validation-plan]
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Rust cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri -> target
          shared-key: fylura-Windows-package-v2
          cache-workspace-crates: true
          cache-targets: true
          cache-on-failure: true
      - name: Build NSIS package
        run: npm run build
      - name: Run disposable fresh / repeat / rollback / uninstall cycle
        shell: pwsh
        run: |
          $installers = @(Get-ChildItem -LiteralPath 'src-tauri/target/release/bundle/nsis' -Filter '*.exe' -File)
          if ($installers.Count -ne 1) { throw "Expected exactly one NSIS installer, found $($installers.Count)." }
          ./scripts/verifyWindowsNsisLifecycle.ps1 `
            -InstallerPath $installers[0].FullName `
            -EvidencePath "$env:RUNNER_TEMP/fylura-nsis-runtime-$env:GITHUB_SHA.json"
      - name: Upload Windows NSIS runtime lifecycle evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: fylura-nsis-runtime-${{ github.sha }}
          path: ${{ runner.temp }}/fylura-nsis-runtime-${{ github.sha }}.json
          if-no-files-found: warn
          retention-days: 7

  package-macos:
    name: Package unsigned DMG
    needs: [source-evidence, validation-plan]
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Verify Apple Silicon runner
        shell: bash
        run: |
          test "$(uname -m)" = "arm64"
          sw_vers
          rustc -vV
          test "$(rustc -vV | sed -n 's/^host: //p')" = "aarch64-apple-darwin"
          echo "MACOSX_DEPLOYMENT_TARGET=13.0" >> "$GITHUB_ENV"
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Rust cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri -> target
          shared-key: fylura-macOS-package-v2
          cache-workspace-crates: true
          cache-targets: true
          cache-on-failure: true
      - name: Build unsigned DMG
        run: npm run build -- --no-sign
      - name: Run isolated DMG install, launch, restart, and data-preservation cycle
        shell: bash
        run: |
          set -euo pipefail
          dmg_files=(src-tauri/target/release/bundle/dmg/*.dmg)
          if [[ ${#dmg_files[@]} -ne 1 || ! -f ${dmg_files[0]} ]]; then
            echo "Expected exactly one unsigned Fylura DMG, found ${#dmg_files[@]}." >&2
            exit 1
          fi
          bash scripts/verifyMacosDmgLifecycle.sh \
            "${dmg_files[0]}" \
            "$RUNNER_TEMP/fylura-dmg-runtime-$GITHUB_SHA.json"
      - name: Upload macOS DMG runtime lifecycle evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: fylura-dmg-runtime-${{ github.sha }}
          path: ${{ runner.temp }}/fylura-dmg-runtime-${{ github.sha }}.json
          if-no-files-found: warn
          retention-days: 7

  performance-profile:
    name: Performance profile
    needs: [validation-plan, performance-prepare, performance-search, performance-scan-schema, performance-library-content, performance-intelligence, performance-workspace-foundation, performance-preview-platform]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout CI validation helper
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Setup Node for CI validation helper
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
      - name: Verify validation plan
        env:
          EVENT_NAME: ${{ github.event_name }}
          PLAN_RESULT: ${{ needs.validation-plan.result }}
          PLAN_VALID: ${{ needs.validation-plan.outputs.plan_valid }}
          TREE_EQUIVALENT: not_applicable
          HEAD_VALIDATION_REQUIRED: "false"
          VALIDATION_LANES: ${{ needs.validation-plan.outputs.validation_lanes }}
          VALIDATION_LANE: ${{ github.event_name == 'workflow_dispatch' && 'manual_full_validation' || 'scheduled_full_validation' }}
        run: node scripts/ciValidationPlan.mjs --aggregate
      - name: Verify all performance shards
        env:
          VALIDATION_PLAN: ${{ needs.validation-plan.result }}
          PREPARE: ${{ needs.performance-prepare.result }}
          SEARCH: ${{ needs.performance-search.result }}
          SCAN_SCHEMA: ${{ needs.performance-scan-schema.result }}
          LIBRARY_CONTENT: ${{ needs.performance-library-content.result }}
          INTELLIGENCE: ${{ needs.performance-intelligence.result }}
          WORKSPACE_FOUNDATION: ${{ needs.performance-workspace-foundation.result }}
          PREVIEW_PLATFORM: ${{ needs.performance-preview-platform.result }}
        run: |
          set -euo pipefail
          test "$VALIDATION_PLAN" = success
          test "$PREPARE" = success
          test "$SEARCH" = success
          test "$SCAN_SCHEMA" = success
          test "$LIBRARY_CONTENT" = success
          test "$INTELLIGENCE" = success
          test "$WORKSPACE_FOUNDATION" = success
          test "$PREVIEW_PLATFORM" = success
          {
            echo "## Performance profile"
            echo "- Search: $SEARCH"
            echo "- Scan/Schema: $SCAN_SCHEMA"
            echo "- Library/Content: $LIBRARY_CONTENT"
            echo "- Intelligence: $INTELLIGENCE"
            echo "- Workspace Foundation: $WORKSPACE_FOUNDATION"
            echo "- Preview Platform: $PREVIEW_PLATFORM"
          } >> "$GITHUB_STEP_SUMMARY"

  performance-macos:
    name: Native macOS performance (arm64)
    needs: [source-evidence, validation-plan]
    runs-on: macos-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Verify Apple Silicon runner
        shell: bash
        run: |
          test "$(uname -m)" = "arm64"
          sw_vers
          rustc -vV
          test "$(rustc -vV | sed -n 's/^host: //p')" = "aarch64-apple-darwin"
          echo "MACOSX_DEPLOYMENT_TARGET=13.0" >> "$GITHUB_ENV"
      - name: Setup Node for the shared performance framework
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
      - name: Rust cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri -> target
          shared-key: fylura-macOS-native-performance
          cache-workspace-crates: true
          cache-targets: true
          cache-on-failure: true
      - name: Compute native prepared binary identity
        id: native-binary-build-identity
        shell: bash
        run: node scripts/performanceBuildIdentity.mjs --suites=workspace-foundation,preview-platform --profile=full
      - name: Restore native prepared binary cache
        id: native-binary-cache
        uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: .performance-cache/binaries
          key: fylura-perf-binaries-${{ runner.os }}-${{ runner.arch }}-${{ steps.native-binary-build-identity.outputs.build_identity }}
      - name: Report native prepared binary cache state
        shell: bash
        run: echo "[perf-native-macos] prepared-binary-cache=${{ steps.native-binary-cache.outputs.cache-hit == 'true' && 'hit' || 'miss' }}"
      - name: Run native macOS corpus and bookkeeping profiles
        shell: bash
        run: |
          export ZC_MACOS_NATIVE_FULL_PROFILE=1
          cargo test --manifest-path src-tauri/Cargo.toml --features desktop-runtime --lib native_classifier_real_mixed_filesystem_corpus_is_atomic -- --nocapture
          cargo test --manifest-path src-tauri/Cargo.toml --features desktop-runtime --lib macos_native_bookkeeping_benchmark_is_bounded_by_unique_identity -- --nocapture
          cargo test --manifest-path src-tauri/Cargo.toml --features desktop-runtime --lib full_native_profile_streams_a_logical_ten_gib_source_once -- --nocapture
          cargo test --manifest-path src-tauri/Cargo.toml --features desktop-runtime --test macos_file_provider_feasibility -- --nocapture
          cargo test --manifest-path src-tauri/Cargo.toml --features "desktop-runtime native-qa" --test macos_native_hardening_smoke -- --nocapture --test-threads=1
      - name: Prepare native Workspace Foundation performance binary
        shell: bash
        run: |
          node scripts/preparePerformanceBinaries.mjs \
            --suites=workspace-foundation,preview-platform \
            --profile=full \
            --cache-root=.performance-cache/binaries \
            --output=.performance-artifacts/binaries
      - name: Save native prepared binary cache
        if: ${{ steps.native-binary-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: .performance-cache/binaries
          key: fylura-perf-binaries-${{ runner.os }}-${{ runner.arch }}-${{ steps.native-binary-build-identity.outputs.build_identity }}
      - name: Run File Workspace Foundation through the shared performance framework
        shell: bash
        run: |
          export PERFORMANCE_TEMP="$PWD/.performance-temp"
          mkdir -p "$PERFORMANCE_TEMP"
          export TEMP="$PERFORMANCE_TEMP"
          export TMP="$PERFORMANCE_TEMP"
          node scripts/runPerformanceSuite.mjs \
            --suite=workspace-foundation \
            --profile=full \
            --prepared-binaries=.performance-artifacts/binaries/workspace-foundation \
            --build-identity="${{ steps.native-binary-build-identity.outputs.build_identity }}"
      - name: Run Preview Platform Phase A preparation suite on native macOS
        shell: bash
        run: |
          export PERFORMANCE_TEMP="$PWD/.performance-temp-preview"
          mkdir -p "$PERFORMANCE_TEMP"
          export TEMP="$PERFORMANCE_TEMP"
          export TMP="$PERFORMANCE_TEMP"
          node scripts/runPerformanceSuite.mjs \
            --suite=preview-platform \
            --profile=full \
            --prepared-binaries=.performance-artifacts/binaries/preview-platform \
            --build-identity="${{ steps.native-binary-build-identity.outputs.build_identity }}"

  quality-windows:
    name: Quality (windows-latest)
    needs: [validation-plan, frontend-quality, rust-windows, windows-native-preview-handler, performance-profile, build-windows, package-windows, dependency-audit]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout CI validation helper
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Setup Node for CI validation helper
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
      - name: Verify validation plan
        env:
          EVENT_NAME: ${{ github.event_name }}
          PLAN_RESULT: ${{ needs.validation-plan.result }}
          PLAN_VALID: ${{ needs.validation-plan.outputs.plan_valid }}
          TREE_EQUIVALENT: not_applicable
          HEAD_VALIDATION_REQUIRED: "false"
          VALIDATION_LANES: ${{ needs.validation-plan.outputs.validation_lanes }}
          VALIDATION_LANE: ${{ github.event_name == 'workflow_dispatch' && 'manual_full_validation' || 'scheduled_full_validation' }}
        run: node scripts/ciValidationPlan.mjs --aggregate
      - name: Verify complete Windows gate
        env:
          VALIDATION_PLAN: ${{ needs.validation-plan.result }}
          FRONTEND: ${{ needs.frontend-quality.result }}
          RUST: ${{ needs.rust-windows.result }}
          WINDOWS_NATIVE: ${{ needs.windows-native-preview-handler.result }}
          PERFORMANCE: ${{ needs.performance-profile.result }}
          BUILD: ${{ needs.build-windows.result }}
          PACKAGE: ${{ needs.package-windows.result }}
          AUDIT: ${{ needs.dependency-audit.result }}
        run: |
          set -euo pipefail
          test "$VALIDATION_PLAN" = success
          test "$FRONTEND" = success
          test "$RUST" = success
          test "$WINDOWS_NATIVE" = success
          test "$PERFORMANCE" = success
          test "$BUILD" = success
          test "$PACKAGE" = success
          test "$AUDIT" = success

