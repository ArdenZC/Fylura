name: CI Full Validation

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:
    inputs:
      full_validation:
        description: Run the complete 1M performance and release matrix
        required: false
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: ci-full-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  source-evidence:
    name: Full Validation / source evidence
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      event_checkout_sha: ${{ steps.full-evidence.outputs.actual_checkout_sha }}
      event_tree_sha: ${{ steps.full-evidence.outputs.actual_checkout_tree }}
    steps:
      - name: Checkout selected immutable source commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
      - name: Record Full Validation source evidence
        id: full-evidence
        env:
          CI_LANE: ${{ github.event_name == 'workflow_dispatch' && 'manual_full_validation' || 'scheduled_full_validation' }}
          EVENT_NAME: ${{ github.event_name }}
          REPOSITORY: ${{ github.repository }}
          EVENT_SHA: ${{ github.sha }}
          SELECTED_REF: ${{ github.ref }}
        run: node scripts/ciEvidence.mjs
      - name: Validate selected-source governance contracts
        run: npm run test:governance
      - name: Upload Full Validation source evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ci-full-source-evidence
          path: .ci-evidence
          include-hidden-files: true
          if-no-files-found: ignore

  validation-plan:
    name: Full Validation / lane plan
    needs: source-evidence
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      plan_valid: ${{ steps.plan.outputs.plan_valid }}
      validation_lanes: ${{ steps.plan.outputs.validation_lanes }}
      event_checkout_sha: ${{ steps.plan.outputs.event_checkout_sha }}
      event_tree_sha: ${{ steps.plan.outputs.event_tree_sha }}
    steps:
      - name: Checkout workflow helper
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
      - name: Verify immutable Full Validation lane
        id: plan
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_CHECKOUT_SHA: ${{ needs.source-evidence.outputs.event_checkout_sha }}
          EVENT_TREE_SHA: ${{ needs.source-evidence.outputs.event_tree_sha }}
          SOURCE_EVIDENCE_RESULT: ${{ needs.source-evidence.result }}
          VALIDATION_LANE: ${{ github.event_name == 'workflow_dispatch' && 'manual_full_validation' || 'scheduled_full_validation' }}
        run: node scripts/ciValidationPlan.mjs

  frontend-quality:
    name: Frontend and format quality
    needs: [source-evidence, validation-plan]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.tmp-tests/playwright-browsers
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Cache Playwright Chromium
        id: playwright-browser-cache
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: .tmp-tests/playwright-browsers
          key: fylura-playwright-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('package-lock.json') }}
      - name: Install Chromium system dependencies
        shell: bash
        run: |
          set -euo pipefail
          max_attempts=2
          per_attempt_timeout=7m
          backoff_seconds=10

          cleanup_apt_processes() {
            local pids
            if pids="$(pgrep -x apt-get)"; then
              echo "[playwright-deps] terminating orphaned apt-get pids=${pids}"
              for pid in $pids; do
                if sudo -n kill -TERM "$pid"; then
                  echo "[playwright-deps] sent TERM to apt-get pid=${pid}"
                else
                  echo "[playwright-deps] apt-get pid=${pid} already exited"
                fi
              done
              sleep 2
              if pids="$(pgrep -x apt-get)"; then
                for pid in $pids; do
                  if sudo -n kill -KILL "$pid"; then
                    echo "[playwright-deps] sent KILL to apt-get pid=${pid}"
                  else
                    echo "[playwright-deps] apt-get pid=${pid} already exited"
                  fi
                done
                sleep 2
              fi
            fi
          }

          for attempt in $(seq 1 "$max_attempts"); do
            echo "[playwright-deps] attempt=${attempt}/${max_attempts} timeout=${per_attempt_timeout}"
            if timeout --signal=TERM --kill-after=30s "$per_attempt_timeout" npx playwright install-deps chromium; then
              status=0
            else
              status=$?
            fi

            if [ "$status" -eq 0 ]; then
              echo "[playwright-deps] PASS attempt=${attempt}"
              exit 0
            fi

            if [ "$status" -eq 124 ] || [ "$status" -eq 137 ]; then
              echo "[playwright-deps] TIMEOUT attempt=${attempt} exit=${status}"
              cleanup_apt_processes
            else
              echo "[playwright-deps] FAIL attempt=${attempt} exit=${status}"
            fi

            if [ "$attempt" -eq "$max_attempts" ]; then
              echo "[playwright-deps] exhausted retries"
              exit "$status"
            fi

            echo "[playwright-deps] backoff=${backoff_seconds}s before retry"
            sleep "$backoff_seconds"
          done
      - name: Install Chromium browser
        if: steps.playwright-browser-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          max_attempts=2
          per_attempt_timeout=5m
          backoff_seconds=10

          for attempt in $(seq 1 "$max_attempts"); do
            echo "[playwright-browser] attempt=${attempt}/${max_attempts} timeout=${per_attempt_timeout}"
            if timeout --signal=TERM --kill-after=30s "$per_attempt_timeout" npx playwright install chromium; then
              status=0
            else
              status=$?
            fi

            if [ "$status" -eq 0 ]; then
              echo "[playwright-browser] PASS attempt=${attempt}"
              exit 0
            fi

            if [ "$status" -eq 124 ] || [ "$status" -eq 137 ]; then
              echo "[playwright-browser] TIMEOUT attempt=${attempt} exit=${status}"
            else
              echo "[playwright-browser] FAIL attempt=${attempt} exit=${status}"
            fi

            if [ "$attempt" -eq "$max_attempts" ]; then
              echo "[playwright-browser] exhausted retries"
              exit "$status"
            fi

            echo "[playwright-browser] backoff=${backoff_seconds}s before retry"
            sleep "$backoff_seconds"
          done
      - name: Frontend tests and architecture checks
        run: |
          npm run typecheck
          npm test
          npm run test:remediation
          npm run test:performance:architecture
      - name: Build frontend
        run: npm run build:frontend
      - name: U3 File Library product browser gate
        env:
          U3_SOURCE_HEAD: ${{ github.sha }}
          U3_EXPECTED_CHECKOUT_SHA: ${{ github.sha }}
        run: npm run test:browser:u3
      - name: Upload U3 browser failure evidence
        if: ${{ failure() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: u3-browser-failure
          path: .tmp-tests/u3-browser
          if-no-files-found: ignore
          retention-days: 2
      - name: U4 File Library product browser gate
        env:
          U4_SOURCE_HEAD: ${{ github.sha }}
          U4_EXPECTED_CHECKOUT_SHA: ${{ github.sha }}
        run: npm run test:browser:u4
      - name: Upload U4 browser failure evidence
        if: ${{ failure() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: u4-browser-failure
          path: .tmp-tests/u4-browser
          if-no-files-found: ignore
          retention-days: 2
      - name: W3-10 Preview integration browser gate
        env:
          W310_SOURCE_HEAD: ${{ github.sha }}
          W310_EXPECTED_CHECKOUT_SHA: ${{ github.sha }}
        run: npm run test:browser:w3-10:real
      - name: Upload W3-10 browser failure evidence
        if: ${{ failure() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: w3-10-browser-failure
          path: |
            .tmp-tests/w3-10-browser-gate-*
            .tmp-tests/w3-09-browser-gate
          if-no-files-found: ignore
          retention-days: 2
      - name: W2-01 real browser regression gate
        env:
          W201_SOURCE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          W201_EXPECTED_CHECKOUT_SHA: ${{ github.sha }}
          W201_LANE: ${{ github.event_name == 'workflow_dispatch' && 'manual_full_validation' || 'scheduled_full_validation' }}
        run: npm run test:browser:w2-01:real
      - name: Upload W2-01 browser gate failure artifacts
        if: ${{ failure() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: w2-01-browser-gate-failure
          path: .tmp-tests/w2-01-browser-gate
          if-no-files-found: ignore
      - name: W2-10 interaction accessibility responsive browser gate
        env:
          W210_SOURCE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          W210_EXPECTED_CHECKOUT_SHA: ${{ github.sha }}
          W210_LANE: ${{ github.event_name == 'workflow_dispatch' && 'manual_full_validation' || 'scheduled_full_validation' }}
        run: npm run test:browser:w2-10:real
      - name: Upload W2-10 browser gate failure artifacts
        if: ${{ failure() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: w2-10-browser-gate-failure
          path: .tmp-tests/w2-10-browser-gate
          if-no-files-found: ignore
      - name: W2-11 integrated experience performance browser gate
        env:
          W211_SOURCE_HEAD: ${{ github.sha }}
          W211_EXPECTED_CHECKOUT_SHA: ${{ github.sha }}
          W211_LANE: ${{ github.event_name == 'workflow_dispatch' && 'manual_full_validation' || 'scheduled_full_validation' }}
        run: npm run test:browser:w2-11:real
      - name: Upload W2-11 browser gate failure artifacts
        if: ${{ failure() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: w2-11-browser-gate-failure
          path: .tmp-tests/w2-11-browser-gate
          if-no-files-found: ignore

  rust-windows:
    name: Rust quality (windows-latest)
    needs: [source-evidence, validation-plan]
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Rust cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri -> target
          shared-key: fylura-Windows-v2
          cache-workspace-crates: true
          cache-targets: true
          cache-on-failure: true
      - name: Rust format
        run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
      - name: Rust clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --features desktop-runtime --all-targets -- -D warnings
      - name: Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --features desktop-runtime
      - name: Native filesystem hardening smoke
        run: cargo test --manifest-path src-tauri/Cargo.toml --features "desktop-runtime native-qa" --test native_file_hardening_smoke -- --ignored --nocapture --test-threads=1

  windows-native-preview-handler:
    name: Windows native Preview Handler
    needs: [source-evidence, validation-plan]
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Rust cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri/native -> target
          shared-key: fylura-Windows-native-preview-handler-v1-full
          cache-workspace-crates: true
          cache-targets: true
          cache-on-failure: true
      - name: Native workspace format
        run: cargo fmt --manifest-path src-tauri/native/Cargo.toml --all -- --check
      - name: Native workspace clippy
        run: cargo clippy --manifest-path src-tauri/native/Cargo.toml --all-targets -- -D warnings
      - name: Native workspace tests
        run: cargo test --manifest-path src-tauri/native/Cargo.toml
      - name: Compile test-only Explorer registration runner
        run: cargo check --manifest-path src-tauri/native/windows-preview-handler/Cargo.toml --bin fylura-windows-preview-handler-real-host --features test-registration
      - name: Build Windows Preview Handler DLL
        run: cargo build --release --manifest-path src-tauri/native/windows-preview-handler/Cargo.toml --features test-observability
      - name: Build Windows Preview Handler harness
        run: cargo build --release --manifest-path src-tauri/native/windows-preview-handler-harness/Cargo.toml
      - name: Build mapped Preview DLL servicing smoke
        run: cargo build --release --manifest-path src-tauri/native/windows-preview-handler-harness/Cargo.toml --bin fylura-windows-preview-dll-servicing-smoke
      - name: Run controlled Windows Preview Handler harness
        shell: pwsh
        run: |
          $nativeTarget = Join-Path $PWD "src-tauri/native/target/release"
          $fixtureRoot = Join-Path $PWD ".tmp-tests/w4-03-v2-harness"
          & (Join-Path $nativeTarget "fylura-windows-preview-handler-harness.exe") `
            (Join-Path $nativeTarget "fylura_windows_preview_handler.dll") `
            $fixtureRoot
          if ($LASTEXITCODE -ne 0) { throw "controlled Windows Preview Handler harness failed with exit code $LASTEXITCODE" }
      - name: Run mapped Preview DLL servicing smoke
        shell: pwsh
        run: |
          $nativeTarget = Join-Path $PWD "src-tauri/native/target/release"
          $fixtureRoot = Join-Path $PWD ".tmp-tests/w4-04-preview-dll-servicing-smoke"
          & (Join-Path $nativeTarget "fylura-windows-preview-dll-servicing-smoke.exe") `
            (Join-Path $nativeTarget "fylura_windows_preview_handler.dll") `
            $fixtureRoot
          if ($LASTEXITCODE -ne 0) { throw "mapped Preview DLL servicing smoke failed with exit code $LASTEXITCODE" }
      - name: Install NSIS for Preview resource smoke
        shell: pwsh
        run: choco install nsis --yes --no-progress
      - name: Run fresh Preview resource NSIS smoke
        shell: pwsh
        run: |
          node scripts/verifyWindowsNsisPreviewResource.mjs `
            --source src-tauri/native/target/release/fylura_windows_preview_handler.dll
          if ($LASTEXITCODE -ne 0) { throw "fresh Preview resource NSIS smoke failed with exit code $LASTEXITCODE" }
      - name: Clean controlled harness fixtures
        if: ${{ always() }}
        shell: pwsh
        run: |
          $fixtureRoot = Join-Path $PWD ".tmp-tests/w4-03-v2-harness"
          if (Test-Path -LiteralPath $fixtureRoot) {
            Remove-Item -LiteralPath $fixtureRoot -Recurse -Force
          }
          $servicingFixtureRoot = Join-Path $PWD ".tmp-tests/w4-04-preview-dll-servicing-smoke"
          if (Test-Path -LiteralPath $servicingFixtureRoot) {
            Remove-Item -LiteralPath $servicingFixtureRoot -Recurse -Force
          }

  rust-macos:
    name: Rust quality (macos-latest)
    needs: [source-evidence, validation-plan]
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Verify Apple Silicon runner
        shell: bash
        run: |
          test "$(uname -m)" = "arm64"
          sw_vers
          rustc -vV
          test "$(rustc -vV | sed -n 's/^host: //p')" = "aarch64-apple-darwin"
          echo "MACOSX_DEPLOYMENT_TARGET=13.0" >> "$GITHUB_ENV"
      - name: Rust cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri -> target
          shared-key: fylura-macOS-v2
          cache-workspace-crates: true
          cache-targets: true
          cache-on-failure: true
      - name: Rust format
        run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
      - name: Rust clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --features "desktop-runtime native-qa" --all-targets -- -D warnings
      - name: Rust tests
        run: |
          cargo test --manifest-path src-tauri/Cargo.toml --features "desktop-runtime native-qa" -- \
            --skip macos_mutation_parity_supports_move_copy_replace_restore_and_delete \
            --skip macos_symlink_and_package_mutations_keep_namespace_boundaries \
            --skip macos_target_conflict_preserves_both_objects_without_claim_artifacts \
            --skip macos_target_creation_race_never_loses_source_payload \
            --skip macos_expanded_adversarial_attack_matrix_reports_zero_wrong_commit_or_loss \
            --skip macos_cross_volume_source_mutation_is_rejected_when_real_fixture_is_provided
      - name: macOS race validation (serial, once)
        env:
          ZEN_CANVAS_MACOS_RACE_ITERATIONS: "100000"
          ZEN_CANVAS_MACOS_EXPANDED_RACE_ITERATIONS: "100000"
        run: cargo test --manifest-path src-tauri/Cargo.toml --features "desktop-runtime native-qa" --test macos_mutation_fail_closed -- --nocapture --test-threads=1
      - name: Apple Silicon native Quick Look lifecycle
        run: cargo run --manifest-path src-tauri/Cargo.toml --bin macos-native-preview-lifecycle --features native-qa

  performance-prepare:
    name: Performance / Prepare
    needs: [source-evidence, validation-plan]
    outputs:
      binary_build_identity: ${{ steps.binary-build-identity.outputs.build_identity }}
      fixture_cache_key: ${{ steps.prepare-artifacts.outputs.fixture_cache_key }}
      fixture_identity: ${{ steps.prepare-artifacts.outputs.fixture_identity }}
      fixture_format_version: ${{ steps.prepare-artifacts.outputs.fixture_format_version }}
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
      - name: Compute performance binary build identity
        id: binary-build-identity
        shell: pwsh
        run: node scripts/performanceBuildIdentity.mjs "--all" "--profile=full"
      - name: Restore reusable prepared binary cache
        id: binary-cache
        uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: .performance-cache/binaries
          key: fylura-perf-binaries-${{ runner.os }}-${{ runner.arch }}-${{ steps.binary-build-identity.outputs.build_identity }}
      - name: Rust cache
        if: ${{ steps.binary-cache.outputs.cache-hit != 'true' }}
        id: rust-cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri -> target
          shared-key: fylura-Windows-performance-v3
          add-job-id-key: false
          cache-workspace-crates: true
          cache-targets: true
          cache-on-failure: true
      - name: Report Rust cache state
        if: ${{ steps.binary-cache.outputs.cache-hit != 'true' }}
        run: echo "[perf-prepare] rust-cache=${{ steps.rust-cache.outputs.cache-hit == 'true' && 'hit' || 'miss' }}"
      - name: Compute reusable fixture identity
        id: fixture-identity
        shell: pwsh
        run: node scripts/performanceFixtureIdentity.mjs "--profile=full"
      - name: Restore reusable fixture cache
        id: fixture-cache
        uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: .tmp-performance-fixtures/cache
          key: ${{ steps.fixture-identity.outputs.fixture_cache_key }}
      - name: Prepare all performance binaries and fixtures
        id: prepare-artifacts
        shell: pwsh
        run: |
          node scripts/preparePerformanceBinaries.mjs "--all" "--profile=full" "--cache-root=.performance-cache/binaries" "--output=.performance-artifacts/binaries"
          node scripts/preparePerformanceFixtures.mjs "--all" "--profile=full" "--prepared-binaries=.performance-artifacts/binaries" "--cache-root=.tmp-performance-fixtures/cache" "--fixture-identity=${{ steps.fixture-identity.outputs.fixture_identity }}"
      - name: Save prepared binary cache
        if: ${{ steps.binary-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: .performance-cache/binaries
          key: fylura-perf-binaries-${{ runner.os }}-${{ runner.arch }}-${{ steps.binary-build-identity.outputs.build_identity }}
      - name: Save prepared fixture cache
        if: ${{ steps.fixture-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: .tmp-performance-fixtures/cache
          key: ${{ steps.fixture-identity.outputs.fixture_cache_key }}
      # Same-run artifact fallback: a restored cache in Prepare is not always readable by the consumer.
      # Keep fixture manifest/hash/row-count validation in runPerformanceSuite.mjs.
      - name: Upload exact Library and Content fixtures for downstream shard
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: perf-fixture-library-content
          path: .tmp-performance-fixtures/cache/${{ steps.fixture-identity.outputs.fixture_identity }}
          if-no-files-found: error
          retention-days: 2
      - name: Upload Search prepared binaries
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: perf-bin-search
          path: .performance-artifacts/binaries/search
          if-no-files-found: error
          retention-days: 2
      - name: Upload Scan and Schema prepared binaries
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: perf-bin-scan-schema
          path: .performance-artifacts/binaries/scan-schema
          if-no-files-found: error
          retention-days: 2
      - name: Upload Library and Content prepared binaries
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: perf-bin-library-content
          path: .performance-artifacts/binaries/library-content
          if-no-files-found: error
          retention-days: 2
      - name: Upload Intelligence prepared binaries
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: perf-bin-intelligence
          path: .performance-artifacts/binaries/intelligence
          if-no-files-found: error
          retention-days: 2
      - name: Upload Workspace Foundation prepared binaries
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
