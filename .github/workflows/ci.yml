name: CI

on:
  pull_request: {}
  push:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: ci-interactive-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  source-evidence:
    name: Source checkout / evidence contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      head_checkout_sha: ${{ steps.head-evidence.outputs.actual_checkout_sha }}
      head_tree_sha: ${{ steps.head-evidence.outputs.actual_checkout_tree }}
    steps:
      - name: Checkout exact PR source or pushed commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
      - name: Record source checkout evidence
        id: head-evidence
        env:
          CI_LANE: ${{ github.event_name == 'pull_request' && 'head_validation' || 'push' }}
          EVENT_NAME: ${{ github.event_name }}
          REPOSITORY: ${{ github.repository }}
          EVENT_SHA: ${{ github.sha }}
          EVENT_BEFORE: ${{ github.event.before }}
          SELECTED_REF: ${{ github.ref }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PR_HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: node scripts/ciEvidence.mjs
      - name: Validate source-tree governance contracts
        run: npm run test:governance
      - name: Upload source checkout evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ci-source-evidence
          path: .ci-evidence
          include-hidden-files: true
          if-no-files-found: ignore

  change-scope:
    name: Change scope / routing contract
    needs: source-evidence
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      docs_only: ${{ steps.classify.outputs.docs_only }}
      windows_native_preview_handler_changed: ${{ steps.classify.outputs.windows_native_preview_handler_changed }}
      windows_global_index_service_qualification_changed: ${{ steps.classify.outputs.windows_global_index_service_qualification_changed }}
      frontend_changed: ${{ steps.classify.outputs.frontend_changed }}
      rust_changed: ${{ steps.classify.outputs.rust_changed }}
      macos_sensitive: ${{ steps.classify.outputs.macos_sensitive }}
      performance_sensitive: ${{ steps.classify.outputs.performance_sensitive }}
      high_risk: ${{ steps.classify.outputs.high_risk }}
      package_sensitive: ${{ steps.classify.outputs.package_sensitive }}
      dependency_sensitive: ${{ steps.classify.outputs.dependency_sensitive }}
      release_sensitive: ${{ steps.classify.outputs.release_sensitive }}
      all_domains_100k: ${{ steps.classify.outputs.all_domains_100k }}
      workflow_changed: ${{ steps.classify.outputs.workflow_changed }}
      base_missing: ${{ steps.classify.outputs.base_missing }}
      full_validation: ${{ steps.classify.outputs.full_validation }}
      perf_search: ${{ steps.classify.outputs.perf_search }}
      perf_scan_schema: ${{ steps.classify.outputs.perf_scan_schema }}
      perf_library_content: ${{ steps.classify.outputs.perf_library_content }}
      perf_intelligence: ${{ steps.classify.outputs.perf_intelligence }}
      perf_workspace_foundation: ${{ steps.classify.outputs.perf_workspace_foundation }}
      perf_preview_platform: ${{ steps.classify.outputs.perf_preview_platform }}
      performance_any: ${{ steps.classify.outputs.performance_any }}
      diff_base: ${{ steps.classify.outputs.diff_base }}
      diff_head: ${{ steps.classify.outputs.diff_head }}
      integration_checkout_sha: ${{ steps.merge-evidence.outputs.actual_checkout_sha }}
      integration_tree_sha: ${{ steps.merge-evidence.outputs.actual_checkout_tree }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Require source checkout evidence
        env:
          SOURCE_EVIDENCE_RESULT: ${{ needs.source-evidence.result }}
        run: |
          set -euo pipefail
          test "$SOURCE_EVIDENCE_RESULT" = success
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
      - name: Classify changed files
        id: classify
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BASE: ${{ github.event.before }}
          EVENT_HEAD: ${{ github.sha }}
          DISPATCH_FULL: "false"
          PR_LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
        run: node scripts/classifyCiChanges.mjs
      - name: Record merge-integration checkout evidence
        id: merge-evidence
        env:
          CI_LANE: ${{ github.event_name == 'pull_request' && 'merge_integration' || 'push' }}
          EVENT_NAME: ${{ github.event_name }}
          REPOSITORY: ${{ github.repository }}
          EVENT_SHA: ${{ github.sha }}
          EVENT_BEFORE: ${{ github.event.before }}
          SELECTED_REF: ${{ github.ref }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PR_HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: node scripts/ciEvidence.mjs
      - name: Validate project governance
        run: npm run test:governance
      - name: Upload merge-integration checkout evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ci-merge-integration-evidence
          path: .ci-evidence
          include-hidden-files: true
          if-no-files-found: ignore

  validation-plan:
    name: Validation lane plan
    needs: [source-evidence, change-scope]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      plan_valid: ${{ steps.plan.outputs.plan_valid }}
      tree_equivalent: ${{ steps.plan.outputs.tree_equivalent }}
      head_validation_required: ${{ steps.plan.outputs.head_validation_required }}
      validation_lanes: ${{ steps.plan.outputs.validation_lanes }}
      head_checkout_sha: ${{ steps.plan.outputs.head_checkout_sha }}
      head_tree_sha: ${{ steps.plan.outputs.head_tree_sha }}
      integration_checkout_sha: ${{ steps.plan.outputs.integration_checkout_sha }}
      integration_tree_sha: ${{ steps.plan.outputs.integration_tree_sha }}
    steps:
      - name: Checkout workflow helper
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
      - name: Build validation lane plan
        id: plan
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SHA: ${{ github.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          SOURCE_EVIDENCE_RESULT: ${{ needs.source-evidence.result }}
          CHANGE_SCOPE_RESULT: ${{ needs.change-scope.result }}
          HEAD_CHECKOUT_SHA: ${{ needs.source-evidence.outputs.head_checkout_sha }}
          HEAD_TREE_SHA: ${{ needs.source-evidence.outputs.head_tree_sha }}
          INTEGRATION_CHECKOUT_SHA: ${{ needs.change-scope.outputs.integration_checkout_sha }}
          INTEGRATION_TREE_SHA: ${{ needs.change-scope.outputs.integration_tree_sha }}
          VALIDATION_LANE: ${{ github.event_name == 'pull_request' && 'merge_integration' || 'push' }}
        run: node scripts/ciValidationPlan.mjs

  docs-only-lanes:
    name: Documentation-only validation (${{ matrix.validation_lane }})
    needs: [change-scope, validation-plan]
    if: ${{ needs.change-scope.outputs.docs_only == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        validation_lane: ${{ fromJSON(needs.validation-plan.outputs.validation_lanes) }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout validation lane
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: ${{ matrix.validation_lane == 'head_validation' && github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ matrix.validation_lane == 'head_validation' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
      - name: Validate documentation-only change
        env:
          DOCS_DIFF_BASE: ${{ needs.change-scope.outputs.diff_base }}
          DOCS_DIFF_HEAD: ${{ needs.change-scope.outputs.diff_head }}
        run: |
          npm run test:docs
          git diff --check "$DOCS_DIFF_BASE" "$DOCS_DIFF_HEAD"

      - name: Write sanitized validation lane result
        if: ${{ always() && github.event_name == 'pull_request' }}
        env:
          VALIDATION_JOB_ID: ${{ github.job }}
          VALIDATION_LANE: ${{ matrix.validation_lane }}
          VALIDATION_JOB_RESULT: ${{ job.status }}
          VALIDATION_RUN_ATTEMPT: ${{ github.run_attempt }}
          VALIDATION_ARTIFACT_NAME: ci-lane-result-${{ github.run_attempt }}-${{ github.job }}-${{ matrix.validation_lane }}
          VALIDATION_RESULT_PATH: ${{ runner.temp }}/ci-lane-result.json
        run: |
          node -e 'const fs = require("node:fs"); const path = require("node:path"); const output = process.env.VALIDATION_RESULT_PATH; fs.mkdirSync(path.dirname(output), { recursive: true }); fs.writeFileSync(output, JSON.stringify({ job_id: process.env.VALIDATION_JOB_ID, lane: process.env.VALIDATION_LANE, run_attempt: process.env.VALIDATION_RUN_ATTEMPT, result: process.env.VALIDATION_JOB_RESULT, artifact_name: process.env.VALIDATION_ARTIFACT_NAME }));'
      - name: Upload sanitized validation lane result
        if: ${{ always() && github.event_name == 'pull_request' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ci-lane-result-${{ github.run_attempt }}-${{ github.job }}-${{ matrix.validation_lane }}
          path: ${{ runner.temp }}/ci-lane-result.json
          if-no-files-found: error
          retention-days: 1
  docs-only:
    name: Documentation-only validation
    needs: [change-scope, validation-plan, docs-only-lanes]
    if: ${{ always() && needs.change-scope.outputs.docs_only == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    timeout-minutes: 10
    steps:
      - name: Checkout CI validation helper
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Setup Node for CI validation helper
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
      - name: Download validation lane result artifacts
        if: ${{ github.event_name == 'pull_request' }}
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: ci-lane-result-*
          path: ${{ runner.temp }}/ci-lane-results
      - name: Require all documentation validation lanes
        env:
          EVENT_NAME: ${{ github.event_name }}
          PLAN_RESULT: ${{ needs.validation-plan.result }}
          PLAN_VALID: ${{ needs.validation-plan.outputs.plan_valid }}
          TREE_EQUIVALENT: ${{ needs.validation-plan.outputs.tree_equivalent }}
          HEAD_VALIDATION_REQUIRED: ${{ needs.validation-plan.outputs.head_validation_required }}
          VALIDATION_LANES: ${{ needs.validation-plan.outputs.validation_lanes }}
          LANE_JOB_RESULTS_DIRECTORY: ${{ runner.temp }}/ci-lane-results
          MATRIX_JOB_EXPECTATIONS: >-
            {"docs-only-lanes":"true"}
          LANE_JOB_RESULT: ${{ needs.docs-only-lanes.result }}
        run: env -u GITHUB_TOKEN -u CI_GITHUB_TOKEN -u GH_TOKEN -u GH_ENTERPRISE_TOKEN -u GITHUB_APP_TOKEN -u GH_APP_TOKEN -u ACTIONS_RUNTIME_TOKEN -u ACTIONS_ID_TOKEN_REQUEST_TOKEN -u AUTHORIZATION -u BEARER_TOKEN node scripts/ciValidationPlan.mjs --aggregate

  frontend-quality:
    name: Frontend and format quality (${{ matrix.validation_lane }})
    needs: [change-scope, validation-plan]
    if: ${{ needs.change-scope.outputs.frontend_changed == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        validation_lane: ${{ fromJSON(needs.validation-plan.outputs.validation_lanes) }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.tmp-tests/playwright-browsers
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: ${{ matrix.validation_lane == 'head_validation' && github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ matrix.validation_lane == 'head_validation' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Cache Playwright Chromium
        id: playwright-browser-cache
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: .tmp-tests/playwright-browsers
          key: fylura-playwright-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('package-lock.json') }}
      - name: Install Chromium system dependencies
        shell: bash
        run: |
          set -euo pipefail
          max_attempts=2
          per_attempt_timeout=7m
          backoff_seconds=10

          cleanup_apt_processes() {
            local pids
            if pids="$(pgrep -x apt-get)"; then
              echo "[playwright-deps] terminating orphaned apt-get pids=${pids}"
              for pid in $pids; do
                if sudo -n kill -TERM "$pid"; then
                  echo "[playwright-deps] sent TERM to apt-get pid=${pid}"
                else
                  echo "[playwright-deps] apt-get pid=${pid} already exited"
                fi
              done
              sleep 2
              if pids="$(pgrep -x apt-get)"; then
                for pid in $pids; do
                  if sudo -n kill -KILL "$pid"; then
                    echo "[playwright-deps] sent KILL to apt-get pid=${pid}"
                  else
                    echo "[playwright-deps] apt-get pid=${pid} already exited"
                  fi
                done
                sleep 2
              fi
            fi
          }

          for attempt in $(seq 1 "$max_attempts"); do
            echo "[playwright-deps] attempt=${attempt}/${max_attempts} timeout=${per_attempt_timeout}"
            if timeout --signal=TERM --kill-after=30s "$per_attempt_timeout" npx playwright install-deps chromium; then
              status=0
            else
              status=$?
            fi

            if [ "$status" -eq 0 ]; then
              echo "[playwright-deps] PASS attempt=${attempt}"
              exit 0
            fi

            if [ "$status" -eq 124 ] || [ "$status" -eq 137 ]; then
              echo "[playwright-deps] TIMEOUT attempt=${attempt} exit=${status}"
              cleanup_apt_processes
            else
              echo "[playwright-deps] FAIL attempt=${attempt} exit=${status}"
            fi

            if [ "$attempt" -eq "$max_attempts" ]; then
              echo "[playwright-deps] exhausted retries"
              exit "$status"
            fi

            echo "[playwright-deps] backoff=${backoff_seconds}s before retry"
            sleep "$backoff_seconds"
          done
      - name: Install Chromium browser
        if: steps.playwright-browser-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          max_attempts=2
          per_attempt_timeout=5m
          backoff_seconds=10

          for attempt in $(seq 1 "$max_attempts"); do
            echo "[playwright-browser] attempt=${attempt}/${max_attempts} timeout=${per_attempt_timeout}"
            if timeout --signal=TERM --kill-after=30s "$per_attempt_timeout" npx playwright install chromium; then
              status=0
            else
              status=$?
            fi

            if [ "$status" -eq 0 ]; then
              echo "[playwright-browser] PASS attempt=${attempt}"
              exit 0
            fi

            if [ "$status" -eq 124 ] || [ "$status" -eq 137 ]; then
              echo "[playwright-browser] TIMEOUT attempt=${attempt} exit=${status}"
            else
              echo "[playwright-browser] FAIL attempt=${attempt} exit=${status}"
            fi

            if [ "$attempt" -eq "$max_attempts" ]; then
              echo "[playwright-browser] exhausted retries"
              exit "$status"
            fi

            echo "[playwright-browser] backoff=${backoff_seconds}s before retry"
            sleep "$backoff_seconds"
          done
      - name: Frontend tests and architecture checks
        run: |
          npm run typecheck
          npm test
          npm run test:remediation
          npm run test:performance:architecture
      - name: Build frontend
        run: npm run build:frontend
      - name: U3 File Library product browser gate
        env:
          U3_SOURCE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          U3_EXPECTED_CHECKOUT_SHA: ${{ matrix.validation_lane == 'head_validation' && github.event.pull_request.head.sha || github.sha }}
        run: npm run test:browser:u3
      - name: Upload U3 browser failure evidence
        if: ${{ failure() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: u3-browser-failure-${{ matrix.validation_lane }}
          path: .tmp-tests/u3-browser
          if-no-files-found: ignore
          retention-days: 2
      - name: U4 File Library product browser gate
        env:
          U4_SOURCE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          U4_EXPECTED_CHECKOUT_SHA: ${{ matrix.validation_lane == 'head_validation' && github.event.pull_request.head.sha || github.sha }}
        run: npm run test:browser:u4
      - name: Upload U4 browser failure evidence
        if: ${{ failure() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: u4-browser-failure-${{ matrix.validation_lane }}
          path: .tmp-tests/u4-browser
          if-no-files-found: ignore
          retention-days: 2
      - name: W2-01 real browser regression gate
        env:
          W201_SOURCE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          W201_EXPECTED_CHECKOUT_SHA: ${{ matrix.validation_lane == 'head_validation' && github.event.pull_request.head.sha || github.sha }}
          W201_LANE: ${{ matrix.validation_lane }}
        run: npm run test:browser:w2-01:real
      - name: Upload W2-01 browser gate failure artifacts
        if: ${{ failure() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: w2-01-browser-gate-failure-${{ matrix.validation_lane }}
          path: .tmp-tests/w2-01-browser-gate
          if-no-files-found: ignore
      - name: W2-10 interaction accessibility responsive browser gate
        env:
          W210_SOURCE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          W210_EXPECTED_CHECKOUT_SHA: ${{ matrix.validation_lane == 'head_validation' && github.event.pull_request.head.sha || github.sha }}
          W210_LANE: ${{ matrix.validation_lane }}
        run: npm run test:browser:w2-10:real
      - name: Upload W2-10 browser gate failure artifacts
        if: ${{ failure() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: w2-10-browser-gate-failure-${{ matrix.validation_lane }}
          path: .tmp-tests/w2-10-browser-gate
          if-no-files-found: ignore
      - name: W2-11 integrated experience performance browser gate
        env:
          W211_SOURCE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          W211_EXPECTED_CHECKOUT_SHA: ${{ matrix.validation_lane == 'head_validation' && github.event.pull_request.head.sha || github.sha }}
          W211_LANE: ${{ matrix.validation_lane }}
        run: npm run test:browser:w2-11:real
      - name: Upload W2-11 browser gate failure artifacts
        if: ${{ failure() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: w2-11-browser-gate-failure-${{ matrix.validation_lane }}
          path: .tmp-tests/w2-11-browser-gate
          if-no-files-found: ignore

      - name: Write sanitized validation lane result
        if: ${{ always() && github.event_name == 'pull_request' }}
        env:
          VALIDATION_JOB_ID: ${{ github.job }}
          VALIDATION_LANE: ${{ matrix.validation_lane }}
          VALIDATION_JOB_RESULT: ${{ job.status }}
          VALIDATION_RUN_ATTEMPT: ${{ github.run_attempt }}
          VALIDATION_ARTIFACT_NAME: ci-lane-result-${{ github.run_attempt }}-${{ github.job }}-${{ matrix.validation_lane }}
          VALIDATION_RESULT_PATH: ${{ runner.temp }}/ci-lane-result.json
        run: |
          node -e 'const fs = require("node:fs"); const path = require("node:path"); const output = process.env.VALIDATION_RESULT_PATH; fs.mkdirSync(path.dirname(output), { recursive: true }); fs.writeFileSync(output, JSON.stringify({ job_id: process.env.VALIDATION_JOB_ID, lane: process.env.VALIDATION_LANE, run_attempt: process.env.VALIDATION_RUN_ATTEMPT, result: process.env.VALIDATION_JOB_RESULT, artifact_name: process.env.VALIDATION_ARTIFACT_NAME }));'
      - name: Upload sanitized validation lane result
        if: ${{ always() && github.event_name == 'pull_request' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ci-lane-result-${{ github.run_attempt }}-${{ github.job }}-${{ matrix.validation_lane }}
          path: ${{ runner.temp }}/ci-lane-result.json
          if-no-files-found: error
          retention-days: 1
  rust-windows:
    name: Rust quality (windows-latest) (${{ matrix.validation_lane }})
    needs: [change-scope, validation-plan]
    if: ${{ needs.change-scope.outputs.rust_changed == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        validation_lane: ${{ fromJSON(needs.validation-plan.outputs.validation_lanes) }}
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: ${{ matrix.validation_lane == 'head_validation' && github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ matrix.validation_lane == 'head_validation' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Rust cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri -> target
          shared-key: fylura-Windows-v2-${{ matrix.validation_lane }}
          cache-workspace-crates: true
          cache-targets: true
          cache-on-failure: true
      - name: Rust format
        run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
      - name: Rust clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --features desktop-runtime --all-targets -- -D warnings
      - name: Windows fixture lifecycle concurrency regression
        run: cargo test --manifest-path src-tauri/Cargo.toml --features desktop-runtime --lib file_workspace::change::tests::concurrent_fixture_lifecycles_preserve_their_shared_parent -- --exact --nocapture
      - name: Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --features desktop-runtime
      - name: Managed Scan name-only exclusion characterization
        if: ${{ !cancelled() }}
