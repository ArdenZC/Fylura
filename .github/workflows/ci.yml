    if: ${{ needs.change-scope.outputs.perf_workspace_foundation == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        validation_lane: ${{ fromJSON(needs.validation-plan.outputs.validation_lanes) }}
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      PERF_CHECKOUT_SHA: ${{ matrix.validation_lane == 'head_validation' && github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: ${{ matrix.validation_lane == 'head_validation' && github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ matrix.validation_lane == 'head_validation' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
      - name: Download Workspace Foundation prepared binaries
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: perf-bin-workspace-foundation-${{ matrix.validation_lane }}
          path: .performance-artifacts/binaries
      - name: Read prepared Workspace Foundation binary identity
        id: binary-identity
        shell: pwsh
        run: |
          $manifest = Get-Content ".performance-artifacts/binaries/manifest.json" | ConvertFrom-Json
          if ([string]::IsNullOrWhiteSpace($manifest.buildIdentity)) { throw "Prepared Workspace Foundation binary manifest has no build identity." }
          "build_identity=$($manifest.buildIdentity)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
      - name: Run Workspace Foundation performance suite from prepared binary
        shell: pwsh
        run: |
          $performanceTemp = Join-Path $PWD ".performance-temp"
          New-Item -ItemType Directory -Force -Path $performanceTemp | Out-Null
          $env:TEMP = $performanceTemp
          $env:TMP = $performanceTemp
          node scripts/runPerformanceSuite.mjs "--suite=workspace-foundation" "--profile=${{ needs.change-scope.outputs.full_validation == 'true' && 'full' || 'extended' }}" "--prepared-binaries=.performance-artifacts/binaries" "--build-identity=${{ steps.binary-identity.outputs.build_identity }}"

      - name: Write sanitized validation lane result
        if: ${{ always() && github.event_name == 'pull_request' }}
        env:
          VALIDATION_JOB_ID: ${{ github.job }}
          VALIDATION_LANE: ${{ matrix.validation_lane }}
          VALIDATION_JOB_RESULT: ${{ job.status }}
          VALIDATION_RUN_ATTEMPT: ${{ github.run_attempt }}
          VALIDATION_ARTIFACT_NAME: ci-lane-result-${{ github.run_attempt }}-${{ github.job }}-${{ matrix.validation_lane }}
          VALIDATION_RESULT_PATH: ${{ runner.temp }}/ci-lane-result.json
        run: |
          node -e 'const fs = require("node:fs"); const path = require("node:path"); const output = process.env.VALIDATION_RESULT_PATH; fs.mkdirSync(path.dirname(output), { recursive: true }); fs.writeFileSync(output, JSON.stringify({ job_id: process.env.VALIDATION_JOB_ID, lane: process.env.VALIDATION_LANE, run_attempt: process.env.VALIDATION_RUN_ATTEMPT, result: process.env.VALIDATION_JOB_RESULT, artifact_name: process.env.VALIDATION_ARTIFACT_NAME }));'
      - name: Upload sanitized validation lane result
        if: ${{ always() && github.event_name == 'pull_request' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ci-lane-result-${{ github.run_attempt }}-${{ github.job }}-${{ matrix.validation_lane }}
          path: ${{ runner.temp }}/ci-lane-result.json
          if-no-files-found: error
          retention-days: 1
