  quality-windows:
    name: Quality (windows-latest)
    needs: [change-scope, validation-plan, frontend-quality, rust-windows, windows-native-preview-handler, windows-global-index-service-qualification, performance-profile, build-windows, package-windows, package-smoke, dependency-audit]
    if: ${{ always() && needs.change-scope.outputs.docs_only != 'true' }}
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    timeout-minutes: 10
    steps:
      - name: Checkout CI validation helper
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Setup Node for CI validation helper
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
      - name: Download validation lane result artifacts
        if: ${{ github.event_name == 'pull_request' }}
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: ci-lane-result-*
          path: ${{ runner.temp }}/ci-lane-results
      - name: Verify validation plan
        env:
          EVENT_NAME: ${{ github.event_name }}
          PLAN_RESULT: ${{ needs.validation-plan.result }}
          PLAN_VALID: ${{ needs.validation-plan.outputs.plan_valid }}
          TREE_EQUIVALENT: ${{ needs.validation-plan.outputs.tree_equivalent }}
          HEAD_VALIDATION_REQUIRED: ${{ needs.validation-plan.outputs.head_validation_required }}
          VALIDATION_LANES: ${{ needs.validation-plan.outputs.validation_lanes }}
          LANE_JOB_RESULTS_DIRECTORY: ${{ runner.temp }}/ci-lane-results
          MATRIX_JOB_EXPECTATIONS: >-
            {"frontend-quality":"${{ needs.change-scope.outputs.frontend_changed }}","rust-windows":"${{ needs.change-scope.outputs.rust_changed }}","windows-native-preview-handler":"${{ needs.change-scope.outputs.windows_native_preview_handler_changed }}","performance-prepare":"${{ needs.change-scope.outputs.performance_any }}","performance-search":"${{ needs.change-scope.outputs.perf_search }}","performance-scan-schema":"${{ needs.change-scope.outputs.perf_scan_schema }}","performance-library-content":"${{ needs.change-scope.outputs.perf_library_content }}","performance-intelligence":"${{ needs.change-scope.outputs.perf_intelligence }}","performance-workspace-foundation":"${{ needs.change-scope.outputs.perf_workspace_foundation }}","performance-preview-platform":"${{ needs.change-scope.outputs.perf_preview_platform }}","build-windows":"${{ needs.change-scope.outputs.release_sensitive }}","package-windows":"${{ needs.change-scope.outputs.full_validation }}","package-smoke":"${{ needs.change-scope.outputs.package_sensitive == 'true' && needs.change-scope.outputs.full_validation != 'true' }}","dependency-audit":"${{ needs.change-scope.outputs.dependency_sensitive }}"}
        run: env -u GITHUB_TOKEN -u CI_GITHUB_TOKEN -u GH_TOKEN -u GH_ENTERPRISE_TOKEN -u GITHUB_APP_TOKEN -u GH_APP_TOKEN -u ACTIONS_RUNTIME_TOKEN -u ACTIONS_ID_TOKEN_REQUEST_TOKEN -u AUTHORIZATION -u BEARER_TOKEN node scripts/ciValidationPlan.mjs --aggregate
      - name: Verify Windows gate dependencies
        env:
          CLASSIFIER: ${{ needs.change-scope.result }}
          VALIDATION_PLAN: ${{ needs.validation-plan.result }}
          FRONTEND_EXPECTED: ${{ needs.change-scope.outputs.frontend_changed }}
          RUST_EXPECTED: ${{ needs.change-scope.outputs.rust_changed }}
          WINDOWS_NATIVE_EXPECTED: ${{ needs.change-scope.outputs.windows_native_preview_handler_changed }}
          GLOBAL_INDEX_SERVICE_EXPECTED: ${{ needs.change-scope.outputs.windows_global_index_service_qualification_changed }}
          BUILD_EXPECTED: ${{ needs.change-scope.outputs.release_sensitive }}
          PACKAGE_EXPECTED: ${{ needs.change-scope.outputs.full_validation }}
          PACKAGE_SMOKE_EXPECTED: ${{ needs.change-scope.outputs.package_sensitive == 'true' && needs.change-scope.outputs.full_validation != 'true' }}
          AUDIT_EXPECTED: ${{ needs.change-scope.outputs.dependency_sensitive }}
          FRONTEND: ${{ needs.frontend-quality.result }}
          RUST: ${{ needs.rust-windows.result }}
          WINDOWS_NATIVE: ${{ needs.windows-native-preview-handler.result }}
          GLOBAL_INDEX_SERVICE: ${{ needs.windows-global-index-service-qualification.result }}
          PERFORMANCE: ${{ needs.performance-profile.result }}
          BUILD: ${{ needs.build-windows.result }}
          PACKAGE: ${{ needs.package-windows.result }}
          PACKAGE_SMOKE: ${{ needs.package-smoke.result }}
          AUDIT: ${{ needs.dependency-audit.result }}
        run: |
          set -euo pipefail
          test "$CLASSIFIER" = success
          test "$VALIDATION_PLAN" = success
          check_expected() {
            expected="$1"
            actual="$2"
            label="$3"
            if [ "$expected" = true ]; then
              test "$actual" = success || { echo "$label expected success, got $actual"; exit 1; }
            else
              test "$actual" = skipped || { echo "$label expected skipped, got $actual"; exit 1; }
            fi
          }
          check_expected "$FRONTEND_EXPECTED" "$FRONTEND" frontend
          check_expected "$RUST_EXPECTED" "$RUST" rust-windows
          check_expected "$WINDOWS_NATIVE_EXPECTED" "$WINDOWS_NATIVE" windows-native-preview-handler
          check_expected "$GLOBAL_INDEX_SERVICE_EXPECTED" "$GLOBAL_INDEX_SERVICE" windows-global-index-service-qualification
          check_expected true "$PERFORMANCE" performance-profile
          check_expected "$BUILD_EXPECTED" "$BUILD" release-compile-windows
          check_expected "$PACKAGE_EXPECTED" "$PACKAGE" package-windows
          check_expected "$PACKAGE_SMOKE_EXPECTED" "$PACKAGE_SMOKE" package-smoke
          check_expected "$AUDIT_EXPECTED" "$AUDIT" dependency-audit

