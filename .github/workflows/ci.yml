  performance-profile:
    name: Performance profile
    needs: [change-scope, validation-plan, performance-prepare, performance-search, performance-scan-schema, performance-library-content, performance-intelligence, performance-workspace-foundation, performance-preview-platform]
    if: ${{ always() && needs.change-scope.outputs.docs_only != 'true' }}
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    timeout-minutes: 15
    steps:
      - name: Checkout CI validation helper
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Setup Node for CI validation helper
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
      - name: Download validation lane result artifacts
        if: ${{ github.event_name == 'pull_request' }}
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: ci-lane-result-*
          path: ${{ runner.temp }}/ci-lane-results
      - name: Verify validation plan
        env:
          EVENT_NAME: ${{ github.event_name }}
          PLAN_RESULT: ${{ needs.validation-plan.result }}
          PLAN_VALID: ${{ needs.validation-plan.outputs.plan_valid }}
          TREE_EQUIVALENT: ${{ needs.validation-plan.outputs.tree_equivalent }}
          HEAD_VALIDATION_REQUIRED: ${{ needs.validation-plan.outputs.head_validation_required }}
          VALIDATION_LANES: ${{ needs.validation-plan.outputs.validation_lanes }}
          LANE_JOB_RESULTS_DIRECTORY: ${{ runner.temp }}/ci-lane-results
          MATRIX_JOB_EXPECTATIONS: >-
            {"performance-prepare":"${{ needs.change-scope.outputs.performance_any }}","performance-search":"${{ needs.change-scope.outputs.perf_search }}","performance-scan-schema":"${{ needs.change-scope.outputs.perf_scan_schema }}","performance-library-content":"${{ needs.change-scope.outputs.perf_library_content }}","performance-intelligence":"${{ needs.change-scope.outputs.perf_intelligence }}","performance-workspace-foundation":"${{ needs.change-scope.outputs.perf_workspace_foundation }}","performance-preview-platform":"${{ needs.change-scope.outputs.perf_preview_platform }}"}
        run: env -u GITHUB_TOKEN -u CI_GITHUB_TOKEN -u GH_TOKEN -u GH_ENTERPRISE_TOKEN -u GITHUB_APP_TOKEN -u GH_APP_TOKEN -u ACTIONS_RUNTIME_TOKEN -u ACTIONS_ID_TOKEN_REQUEST_TOKEN -u AUTHORIZATION -u BEARER_TOKEN node scripts/ciValidationPlan.mjs --aggregate
      - name: Verify expected performance shard results
        env:
          CLASSIFIER: ${{ needs.change-scope.result }}
          VALIDATION_PLAN: ${{ needs.validation-plan.result }}
          PREPARE: ${{ needs.performance-prepare.result }}
          EXPECTED_ANY: ${{ needs.change-scope.outputs.performance_any }}
          EXPECTED_SEARCH: ${{ needs.change-scope.outputs.perf_search }}
          EXPECTED_SCAN_SCHEMA: ${{ needs.change-scope.outputs.perf_scan_schema }}
          EXPECTED_LIBRARY_CONTENT: ${{ needs.change-scope.outputs.perf_library_content }}
          EXPECTED_INTELLIGENCE: ${{ needs.change-scope.outputs.perf_intelligence }}
          EXPECTED_WORKSPACE_FOUNDATION: ${{ needs.change-scope.outputs.perf_workspace_foundation }}
          EXPECTED_PREVIEW_PLATFORM: ${{ needs.change-scope.outputs.perf_preview_platform }}
          ACTUAL_SEARCH: ${{ needs.performance-search.result }}
          ACTUAL_SCAN_SCHEMA: ${{ needs.performance-scan-schema.result }}
          ACTUAL_LIBRARY_CONTENT: ${{ needs.performance-library-content.result }}
          ACTUAL_INTELLIGENCE: ${{ needs.performance-intelligence.result }}
          ACTUAL_WORKSPACE_FOUNDATION: ${{ needs.performance-workspace-foundation.result }}
          ACTUAL_PREVIEW_PLATFORM: ${{ needs.performance-preview-platform.result }}
        run: |
          set -euo pipefail
          test "$CLASSIFIER" = success
          test "$VALIDATION_PLAN" = success
          if [ "$EXPECTED_ANY" = true ]; then
            test "$PREPARE" = success
          fi
          check_shard() {
            expected="$1"
            actual="$2"
            label="$3"
            if [ "$expected" = true ]; then
              test "$actual" = success || { echo "$label expected success, got $actual"; exit 1; }
            else
              test "$actual" = skipped || { echo "$label expected skipped, got $actual"; exit 1; }
            fi
          }
          check_shard "$EXPECTED_SEARCH" "$ACTUAL_SEARCH" search
          check_shard "$EXPECTED_SCAN_SCHEMA" "$ACTUAL_SCAN_SCHEMA" scan-schema
          check_shard "$EXPECTED_LIBRARY_CONTENT" "$ACTUAL_LIBRARY_CONTENT" library-content
          check_shard "$EXPECTED_INTELLIGENCE" "$ACTUAL_INTELLIGENCE" intelligence
          check_shard "$EXPECTED_WORKSPACE_FOUNDATION" "$ACTUAL_WORKSPACE_FOUNDATION" workspace-foundation
          check_shard "$EXPECTED_PREVIEW_PLATFORM" "$ACTUAL_PREVIEW_PLATFORM" preview-platform
          {
            echo "## Performance profile"
            echo "- Search: $ACTUAL_SEARCH (expected=$EXPECTED_SEARCH)"
            echo "- Scan/Schema: $ACTUAL_SCAN_SCHEMA (expected=$EXPECTED_SCAN_SCHEMA)"
            echo "- Library/Content: $ACTUAL_LIBRARY_CONTENT (expected=$EXPECTED_LIBRARY_CONTENT)"
            echo "- Intelligence: $ACTUAL_INTELLIGENCE (expected=$EXPECTED_INTELLIGENCE)"
            echo "- Workspace Foundation: $ACTUAL_WORKSPACE_FOUNDATION (expected=$EXPECTED_WORKSPACE_FOUNDATION)"
            echo "- Preview Platform: $ACTUAL_PREVIEW_PLATFORM (expected=$EXPECTED_PREVIEW_PLATFORM)"
          } >> "$GITHUB_STEP_SUMMARY"

  performance-macos:
    name: Native macOS performance (arm64) (${{ matrix.validation_lane }})
    needs: [change-scope, validation-plan]
    if: ${{ needs.change-scope.outputs.docs_only != 'true' && (needs.change-scope.outputs.full_validation == 'true' || needs.change-scope.outputs.performance_sensitive == 'true') }}
    strategy:
      fail-fast: false
      matrix:
        validation_lane: ${{ fromJSON(needs.validation-plan.outputs.validation_lanes) }}
    runs-on: macos-latest
    timeout-minutes: 35
    env:
      PERF_CHECKOUT_SHA: ${{ matrix.validation_lane == 'head_validation' && github.event.pull_request.head.sha || github.sha }}
      CACHE_WRITE_ALLOWED: ${{ github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == github.repository && matrix.validation_lane == 'merge_integration') }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: ${{ matrix.validation_lane == 'head_validation' && github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ matrix.validation_lane == 'head_validation' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify Apple Silicon runner
        shell: bash
        run: |
          test "$(uname -m)" = "arm64"
          rustc -vV
          test "$(rustc -vV | sed -n 's/^host: //p')" = "aarch64-apple-darwin"
          echo "MACOSX_DEPLOYMENT_TARGET=13.0" >> "$GITHUB_ENV"
      - name: Setup Node for the shared performance framework
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
      - name: Rust cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri -> target
          shared-key: fylura-macOS-native-performance-${{ matrix.validation_lane }}
          cache-on-failure: true
      - name: Compute native prepared binary identity
        id: native-binary-build-identity
        shell: bash
        run: node scripts/performanceBuildIdentity.mjs "--suites=workspace-foundation,preview-platform" "--profile=${{ needs.change-scope.outputs.full_validation == 'true' && 'full' || 'extended' }}"
      - name: Restore native prepared binary cache
        id: native-binary-cache
        uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: .performance-cache/binaries
          key: fylura-perf-binaries-${{ runner.os }}-${{ runner.arch }}-${{ steps.native-binary-build-identity.outputs.build_identity }}
      - name: Report native prepared binary cache state
        shell: bash
        run: echo "[perf-native-macos] prepared-binary-cache=${{ steps.native-binary-cache.outputs.cache-hit == 'true' && 'hit' || 'miss' }}"
      - name: Run native macOS corpus and bookkeeping profiles
        shell: bash
        env:
          FULL_VALIDATION: ${{ needs.change-scope.outputs.full_validation }}
        run: |
          if [ "$FULL_VALIDATION" = true ]; then
            export ZC_MACOS_NATIVE_FULL_PROFILE=1
          fi
          cargo test --manifest-path src-tauri/Cargo.toml --features desktop-runtime --lib native_classifier_real_mixed_filesystem_corpus_is_atomic -- --nocapture
          cargo test --manifest-path src-tauri/Cargo.toml --features desktop-runtime --lib macos_native_bookkeeping_benchmark_is_bounded_by_unique_identity -- --nocapture
          cargo test --manifest-path src-tauri/Cargo.toml --features desktop-runtime --test macos_file_provider_feasibility -- --nocapture
      - name: Prepare native Workspace Foundation performance binary
        shell: bash
        run: |
          node scripts/preparePerformanceBinaries.mjs \
            --suites=workspace-foundation,preview-platform \
            --profile="${{ needs.change-scope.outputs.full_validation == 'true' && 'full' || 'extended' }}" \
            --cache-root=.performance-cache/binaries \
            --output=.performance-artifacts/binaries
      - name: Save native prepared binary cache
        if: ${{ steps.native-binary-cache.outputs.cache-hit != 'true' && env.CACHE_WRITE_ALLOWED == 'true' }}
        uses: actions/cache/save@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: .performance-cache/binaries
          key: fylura-perf-binaries-${{ runner.os }}-${{ runner.arch }}-${{ steps.native-binary-build-identity.outputs.build_identity }}
      - name: Run File Workspace Foundation through the shared performance framework
        shell: bash
        run: |
          export PERFORMANCE_TEMP="$PWD/.performance-temp"
          mkdir -p "$PERFORMANCE_TEMP"
          export TEMP="$PERFORMANCE_TEMP"
          export TMP="$PERFORMANCE_TEMP"
          node scripts/runPerformanceSuite.mjs \
            --suite=workspace-foundation \
            --profile="${{ needs.change-scope.outputs.full_validation == 'true' && 'full' || 'extended' }}" \
            --prepared-binaries=.performance-artifacts/binaries/workspace-foundation \
            --build-identity="${{ steps.native-binary-build-identity.outputs.build_identity }}"
      - name: Run Preview Platform Phase A preparation suite on native macOS
        if: ${{ needs.change-scope.outputs.full_validation == 'true' || needs.change-scope.outputs.perf_preview_platform == 'true' }}
        shell: bash
        run: |
          export PERFORMANCE_TEMP="$PWD/.performance-temp-preview"
          mkdir -p "$PERFORMANCE_TEMP"
          export TEMP="$PERFORMANCE_TEMP"
          export TMP="$PERFORMANCE_TEMP"
          node scripts/runPerformanceSuite.mjs \
            --suite=preview-platform \
            --profile="${{ needs.change-scope.outputs.full_validation == 'true' && 'full' || 'extended' }}" \
            --prepared-binaries=.performance-artifacts/binaries/preview-platform \
            --build-identity="${{ steps.native-binary-build-identity.outputs.build_identity }}"

      - name: Write sanitized validation lane result
        if: ${{ always() && github.event_name == 'pull_request' }}
        env:
          VALIDATION_JOB_ID: ${{ github.job }}
          VALIDATION_LANE: ${{ matrix.validation_lane }}
          VALIDATION_JOB_RESULT: ${{ job.status }}
          VALIDATION_RUN_ATTEMPT: ${{ github.run_attempt }}
          VALIDATION_ARTIFACT_NAME: ci-lane-result-${{ github.run_attempt }}-${{ github.job }}-${{ matrix.validation_lane }}
          VALIDATION_RESULT_PATH: ${{ runner.temp }}/ci-lane-result.json
        run: |
          node -e 'const fs = require("node:fs"); const path = require("node:path"); const output = process.env.VALIDATION_RESULT_PATH; fs.mkdirSync(path.dirname(output), { recursive: true }); fs.writeFileSync(output, JSON.stringify({ job_id: process.env.VALIDATION_JOB_ID, lane: process.env.VALIDATION_LANE, run_attempt: process.env.VALIDATION_RUN_ATTEMPT, result: process.env.VALIDATION_JOB_RESULT, artifact_name: process.env.VALIDATION_ARTIFACT_NAME }));'
      - name: Upload sanitized validation lane result
        if: ${{ always() && github.event_name == 'pull_request' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ci-lane-result-${{ github.run_attempt }}-${{ github.job }}-${{ matrix.validation_lane }}
          path: ${{ runner.temp }}/ci-lane-result.json
          if-no-files-found: error
          retention-days: 1
