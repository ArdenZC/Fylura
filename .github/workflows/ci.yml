          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
      - name: Compute performance binary build identity
        id: binary-build-identity
        shell: pwsh
        run: node scripts/performanceBuildIdentity.mjs "--profile=${{ needs.change-scope.outputs.full_validation == 'true' && 'full' || 'extended' }}"
      - name: Restore reusable prepared binary cache
        id: binary-cache
        uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: .performance-cache/binaries
          key: fylura-perf-binaries-${{ runner.os }}-${{ runner.arch }}-${{ steps.binary-build-identity.outputs.build_identity }}
      - name: Rust cache
        if: ${{ steps.binary-cache.outputs.cache-hit != 'true' }}
        id: rust-cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri -> target
          shared-key: fylura-Windows-performance-v3-${{ matrix.validation_lane }}
          add-job-id-key: false
          cache-workspace-crates: true
          cache-targets: true
          cache-on-failure: true
      - name: Report Rust cache state
        if: ${{ steps.binary-cache.outputs.cache-hit != 'true' }}
        run: echo "[perf-prepare] rust-cache=${{ steps.rust-cache.outputs.cache-hit == 'true' && 'hit' || 'miss' }}"
      - name: Compute reusable fixture identity
        if: ${{ needs.change-scope.outputs.perf_library_content == 'true' }}
        id: fixture-identity
        shell: pwsh
        run: node scripts/performanceFixtureIdentity.mjs "--profile=${{ needs.change-scope.outputs.full_validation == 'true' && 'full' || 'extended' }}"
      - name: Restore reusable fixture cache
        if: ${{ needs.change-scope.outputs.perf_library_content == 'true' }}
        id: fixture-cache
        uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: .tmp-performance-fixtures/cache
          key: ${{ steps.fixture-identity.outputs.fixture_cache_key }}
      - name: Prepare performance binaries and fixtures
        id: prepare-artifacts
        shell: pwsh
        run: |
          node scripts/preparePerformanceBinaries.mjs "--profile=${{ needs.change-scope.outputs.full_validation == 'true' && 'full' || 'extended' }}" "--cache-root=.performance-cache/binaries" "--output=.performance-artifacts/binaries"
          if ("${{ needs.change-scope.outputs.perf_library_content }}" -eq "true") {
            node scripts/preparePerformanceFixtures.mjs "--profile=${{ needs.change-scope.outputs.full_validation == 'true' && 'full' || 'extended' }}" "--prepared-binaries=.performance-artifacts/binaries" "--cache-root=.tmp-performance-fixtures/cache" "--fixture-identity=${{ steps.fixture-identity.outputs.fixture_identity }}"
          }
      - name: Save prepared binary cache
        if: ${{ steps.binary-cache.outputs.cache-hit != 'true' && env.CACHE_WRITE_ALLOWED == 'true' }}
        uses: actions/cache/save@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: .performance-cache/binaries
          key: fylura-perf-binaries-${{ runner.os }}-${{ runner.arch }}-${{ steps.binary-build-identity.outputs.build_identity }}
      - name: Save prepared fixture cache
        if: ${{ needs.change-scope.outputs.perf_library_content == 'true' && steps.fixture-cache.outputs.cache-hit != 'true' && env.CACHE_WRITE_ALLOWED == 'true' }}
        uses: actions/cache/save@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: .tmp-performance-fixtures/cache
          key: ${{ steps.fixture-identity.outputs.fixture_cache_key }}
      # Same-run artifact fallback: a restored cache in Prepare is not always readable by the consumer.
      # Keep fixture manifest/hash/row-count validation in runPerformanceSuite.mjs.
      - name: Upload exact Library and Content fixtures for downstream shard
        if: ${{ needs.change-scope.outputs.perf_library_content == 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: perf-fixture-library-content-${{ matrix.validation_lane }}
          path: .tmp-performance-fixtures/cache/${{ steps.fixture-identity.outputs.fixture_identity }}
          if-no-files-found: error
          retention-days: 2
      - name: Upload Search prepared binaries
        if: ${{ needs.change-scope.outputs.perf_search == 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: perf-bin-search-${{ matrix.validation_lane }}
          path: .performance-artifacts/binaries/search
          if-no-files-found: error
          retention-days: 2
      - name: Upload Scan and Schema prepared binaries
        if: ${{ needs.change-scope.outputs.perf_scan_schema == 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: perf-bin-scan-schema-${{ matrix.validation_lane }}
          path: .performance-artifacts/binaries/scan-schema
          if-no-files-found: error
          retention-days: 2
      - name: Upload Library and Content prepared binaries
        if: ${{ needs.change-scope.outputs.perf_library_content == 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: perf-bin-library-content-${{ matrix.validation_lane }}
          path: .performance-artifacts/binaries/library-content
          if-no-files-found: error
          retention-days: 2
      - name: Upload Intelligence prepared binaries
        if: ${{ needs.change-scope.outputs.perf_intelligence == 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: perf-bin-intelligence-${{ matrix.validation_lane }}
          path: .performance-artifacts/binaries/intelligence
          if-no-files-found: error
          retention-days: 2
      - name: Upload Workspace Foundation prepared binaries
        if: ${{ needs.change-scope.outputs.perf_workspace_foundation == 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: perf-bin-workspace-foundation-${{ matrix.validation_lane }}
          path: .performance-artifacts/binaries/workspace-foundation
          if-no-files-found: error
          retention-days: 2

      - name: Upload Preview Platform prepared binaries
        if: ${{ needs.change-scope.outputs.perf_preview_platform == 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: perf-bin-preview-platform-${{ matrix.validation_lane }}
          path: .performance-artifacts/binaries/preview-platform
          if-no-files-found: error
          retention-days: 2

      - name: Write sanitized validation lane result
        if: ${{ always() && github.event_name == 'pull_request' }}
        env:
          VALIDATION_JOB_ID: ${{ github.job }}
          VALIDATION_LANE: ${{ matrix.validation_lane }}
          VALIDATION_JOB_RESULT: ${{ job.status }}
          VALIDATION_RUN_ATTEMPT: ${{ github.run_attempt }}
          VALIDATION_ARTIFACT_NAME: ci-lane-result-${{ github.run_attempt }}-${{ github.job }}-${{ matrix.validation_lane }}
          VALIDATION_RESULT_PATH: ${{ runner.temp }}/ci-lane-result.json
        run: |
          node -e 'const fs = require("node:fs"); const path = require("node:path"); const output = process.env.VALIDATION_RESULT_PATH; fs.mkdirSync(path.dirname(output), { recursive: true }); fs.writeFileSync(output, JSON.stringify({ job_id: process.env.VALIDATION_JOB_ID, lane: process.env.VALIDATION_LANE, run_attempt: process.env.VALIDATION_RUN_ATTEMPT, result: process.env.VALIDATION_JOB_RESULT, artifact_name: process.env.VALIDATION_ARTIFACT_NAME }));'
      - name: Upload sanitized validation lane result
        if: ${{ always() && github.event_name == 'pull_request' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ci-lane-result-${{ github.run_attempt }}-${{ github.job }}-${{ matrix.validation_lane }}
          path: ${{ runner.temp }}/ci-lane-result.json
          if-no-files-found: error
          retention-days: 1
  performance-search:
    name: Performance / Search (${{ matrix.validation_lane }})
    needs: [change-scope, validation-plan, performance-prepare]
    if: ${{ needs.change-scope.outputs.perf_search == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        validation_lane: ${{ fromJSON(needs.validation-plan.outputs.validation_lanes) }}
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      PERF_CHECKOUT_SHA: ${{ matrix.validation_lane == 'head_validation' && github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: ${{ matrix.validation_lane == 'head_validation' && github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ matrix.validation_lane == 'head_validation' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
      - name: Download Search prepared binaries
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: perf-bin-search-${{ matrix.validation_lane }}
          path: .performance-artifacts/binaries
      - name: Read prepared Search binary identity
        id: binary-identity
        shell: pwsh
        run: |
          $manifest = Get-Content ".performance-artifacts/binaries/manifest.json" | ConvertFrom-Json
          if ([string]::IsNullOrWhiteSpace($manifest.buildIdentity)) { throw "Prepared Search binary manifest has no build identity." }
          "build_identity=$($manifest.buildIdentity)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
      - name: Run Search performance suite from prepared binary
        shell: pwsh
        run: |
          $performanceTemp = Join-Path $PWD ".performance-temp"
          New-Item -ItemType Directory -Force -Path $performanceTemp | Out-Null
          $env:TEMP = $performanceTemp
          $env:TMP = $performanceTemp
          node scripts/runPerformanceSuite.mjs "--suite=search" "--profile=${{ needs.change-scope.outputs.full_validation == 'true' && 'full' || 'extended' }}" "--prepared-binaries=.performance-artifacts/binaries" "--build-identity=${{ steps.binary-identity.outputs.build_identity }}"

