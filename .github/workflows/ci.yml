  windows-global-index-service-qualification:
    name: Windows Global Index service qualification
    needs: [change-scope]
    if: ${{ needs.change-scope.outputs.windows_global_index_service_qualification_changed == 'true' }}
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Checkout exact PR source or pushed commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Setup Node for Tauri frontend assets
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
      - name: Install frontend dependencies
        run: npm ci
      - name: Build frontend assets for the exact candidate
        run: npm run build:frontend
      - name: Rust cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri -> target
          shared-key: fylura-Windows-global-index-service-v1
          cache-workspace-crates: true
          cache-targets: true
          cache-on-failure: true
      - name: Build exact desktop candidate and QA probe
        shell: pwsh
        run: |
          cargo build --manifest-path src-tauri/Cargo.toml --release --features "desktop-runtime native-qa" --bin fylura
          if ($LASTEXITCODE -ne 0) { throw "candidate build failed with exit code $LASTEXITCODE" }
          cargo build --manifest-path src-tauri/Cargo.toml --release --features "desktop-runtime native-qa" --bin zb05-global-index-qa
          if ($LASTEXITCODE -ne 0) { throw "qualification probe build failed with exit code $LASTEXITCODE" }
      - name: Run disposable exact-service qualification
        shell: pwsh
        env:
          EXPECTED_SOURCE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          $candidate = Join-Path $PWD "src-tauri/target/release/fylura.exe"
          $probe = Join-Path $PWD "src-tauri/target/release/zb05-global-index-qa.exe"
          $evidenceRoot = Join-Path $env:RUNNER_TEMP "zb05-global-index-service-evidence-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          $evidence = Join-Path $evidenceRoot "zb05-global-index-service-evidence.json"
          & pwsh -NoProfile -File scripts/qualifyWindowsGlobalIndexService.ps1 -CandidateExe $candidate -ProbeExe $probe -EvidencePath $evidence
          if ($LASTEXITCODE -ne 0) { throw "Windows Global Index service qualification failed with exit code $LASTEXITCODE" }
      - name: Require retained exact-service qualification evidence
        if: ${{ always() }}
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $evidenceRoot = Join-Path $env:RUNNER_TEMP "zb05-global-index-service-evidence-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          foreach ($name in @("zb05-global-index-service-evidence.json", "service-recovery.json", "recovery-trace.log")) {
            if (-not (Test-Path -LiteralPath (Join-Path $evidenceRoot $name) -PathType Leaf)) { throw "missing required qualification evidence: $name" }
          }
          if (@(Get-Content -LiteralPath (Join-Path $evidenceRoot "recovery-trace.log")) -cnotcontains "windows_recovery_rebuild_admitted") { throw "retained recovery trace lacks Background admission evidence" }
      - name: Upload exact-service qualification evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: windows-global-index-service-qualification
          path: |
            ${{ runner.temp }}/zb05-global-index-service-evidence-${{ github.run_id }}-${{ github.run_attempt }}/zb05-global-index-service-evidence.json
            ${{ runner.temp }}/zb05-global-index-service-evidence-${{ github.run_id }}-${{ github.run_attempt }}/service-recovery.json
            ${{ runner.temp }}/zb05-global-index-service-evidence-${{ github.run_id }}-${{ github.run_attempt }}/recovery-trace.log
          if-no-files-found: error
      - name: Stop disposable service and remove task profile
        if: ${{ always() }}
        shell: pwsh
        run: |
          $candidate = [IO.Path]::GetFullPath((Join-Path $PWD "src-tauri/target/release/fylura.exe"))
          $serviceName = "FyluraGlobalIndex"
          $taskRoot = [IO.Path]::GetFullPath((Join-Path $env:RUNNER_TEMP "zb05-global-index-service-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"))
          $runnerTemp = [IO.Path]::GetFullPath($env:RUNNER_TEMP).TrimEnd('\') + '\'
          if (-not $taskRoot.StartsWith($runnerTemp, [StringComparison]::OrdinalIgnoreCase)) { throw "refusing cleanup outside RUNNER_TEMP: $taskRoot" }
          $qualificationVhdPath = [IO.Path]::GetFullPath((Join-Path $taskRoot "qualification-volume.vhdx"))
          $qualificationVhdOwnerMarker = Join-Path $taskRoot "qualification-volume-created-by-task.txt"
          $qualificationVhdLetterMarker = Join-Path $taskRoot "qualification-volume-drive-letter.txt"
          $ownsQualificationVhd = $false
          $qualificationVhdLetter = $null
          $ownershipMarker = Join-Path $taskRoot "service-created-by-qualification.txt"
          $ownsService = (Test-Path -LiteralPath $ownershipMarker) -and ((Get-Content -LiteralPath $ownershipMarker -Raw).Trim().Equals($candidate, [StringComparison]::OrdinalIgnoreCase))
          $service = Get-CimInstance Win32_Service -Filter "Name='$serviceName'" -ErrorAction SilentlyContinue
          $expectedImagePath = '"' + $candidate + '" --index-service'
          if ($service -and $ownsService -and $service.PathName.Trim() -ieq $expectedImagePath) {
            if ($service.State -ne "Stopped") {
              & sc.exe stop $serviceName 2>&1 | Out-Host
              Start-Sleep -Seconds 2
            }
            & sc.exe delete $serviceName 2>&1 | Out-Host
          } elseif ($service) {
            Write-Output "Leaving non-task-owned service untouched: $($service.PathName)"
          }
          if ($ownsService) {
            foreach ($process in Get-CimInstance Win32_Process -ErrorAction SilentlyContinue) {
              if ($process.ExecutablePath -and [IO.Path]::GetFullPath($process.ExecutablePath).Equals($candidate, [StringComparison]::OrdinalIgnoreCase)) {
                Stop-Process -Id $process.ProcessId -Force -ErrorAction SilentlyContinue
              }
            }
          }
          if (Test-Path -LiteralPath $qualificationVhdOwnerMarker) {
            $recordedVhdPath = [IO.Path]::GetFullPath((Get-Content -LiteralPath $qualificationVhdOwnerMarker -Raw).Trim())
            if (-not $recordedVhdPath.Equals($qualificationVhdPath, [StringComparison]::OrdinalIgnoreCase)) { throw "refusing cleanup of non-task-owned qualification VHD: $recordedVhdPath" }
            if (-not (Test-Path -LiteralPath $qualificationVhdPath)) { throw "task-owned qualification VHD marker exists without its image: $qualificationVhdPath" }
            $ownsQualificationVhd = $true
            if (Test-Path -LiteralPath $qualificationVhdLetterMarker) {
              $qualificationVhdLetter = (Get-Content -LiteralPath $qualificationVhdLetterMarker -Raw).Trim().ToUpperInvariant()
              if ($qualificationVhdLetter -notmatch '^[A-Z]$') { throw "invalid task-owned qualification drive letter: $qualificationVhdLetter" }
            }
            $qualificationImage = Get-DiskImage -ImagePath $qualificationVhdPath -ErrorAction Stop
            if ($qualificationImage.Attached) {
              Dismount-DiskImage -ImagePath $qualificationVhdPath -Confirm:$false | Out-Null
            }
            $detachDeadline = [DateTime]::UtcNow.AddSeconds(10)
            do {
              $qualificationImage = Get-DiskImage -ImagePath $qualificationVhdPath -ErrorAction Stop
              if (-not $qualificationImage.Attached) { break }
              Start-Sleep -Milliseconds 200
            } while ([DateTime]::UtcNow -lt $detachDeadline)
            if ($qualificationImage.Attached) { throw "task-owned qualification VHD remains attached: $qualificationVhdPath" }
            if ($qualificationVhdLetter) {
              $mountedVolume = Get-CimInstance Win32_LogicalDisk -Filter "DeviceID='$($qualificationVhdLetter):'" -ErrorAction SilentlyContinue
              if ($mountedVolume) { throw "task-owned qualification drive letter remains mounted: $qualificationVhdLetter`:" }
            }
          } elseif (Test-Path -LiteralPath $qualificationVhdPath) {
            throw "refusing to delete an unmarked qualification VHD: $qualificationVhdPath"
          }
          $fixtureMarker = Join-Path $taskRoot "fixture-root-created-by-qualification.txt"
          if (Test-Path -LiteralPath $fixtureMarker) {
            $fixtureRoot = [IO.Path]::GetFullPath((Get-Content -LiteralPath $fixtureMarker -Raw).Trim())
            $allowedFixtureRoots = @((Join-Path $taskRoot "fixtures"))
            if ($ownsQualificationVhd -and $qualificationVhdLetter) { $allowedFixtureRoots += "$($qualificationVhdLetter):\fixtures" }
            $ownsFixtureRoot = @($allowedFixtureRoots | Where-Object { [IO.Path]::GetFullPath($_).Equals($fixtureRoot, [StringComparison]::OrdinalIgnoreCase) }).Count -gt 0
            if (-not $ownsFixtureRoot) { throw "leaving unexpected qualification fixture root untouched: $fixtureRoot" }
            if (-not ($ownsQualificationVhd -and $qualificationVhdLetter) -and (Test-Path -LiteralPath $fixtureRoot)) { Remove-Item -LiteralPath $fixtureRoot -Recurse -Force }
          }
          if (Test-Path -LiteralPath $taskRoot) { Remove-Item -LiteralPath $taskRoot -Recurse -Force }

