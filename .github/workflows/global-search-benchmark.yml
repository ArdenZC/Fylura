name: Global Search synthetic benchmark

on:
  pull_request:
    paths:
      - "src-tauri/src/global_index/repository.rs"
      - "src-tauri/src/global_index/tests.rs"
      - "src-tauri/src/global_index/tests/global_search_benchmark.rs"
      - "src-tauri/src/global_index/tests/global_search_index_cost_benchmark.rs"
      - "src-tauri/src/global_index/tests/global_search_query_cost_diagnostic.rs"
      - ".github/workflows/global-search-benchmark.yml"
  workflow_dispatch:
    inputs:
      entries:
        description: Synthetic Global Index row count
        required: true
        type: choice
        default: "100000"
        options:
          - "100000"
          - "500000"
          - "1000000"
          - "2000000"
          - "5000000"
      cost_entries:
        description: Synthetic row count for the test-only index-ingestion cost experiment
        required: false
        type: choice
        default: "100000"
        options:
          - "1000"
          - "10000"
          - "100000"
      mode:
        description: Run the official benchmark or a focused diagnostic
        required: true
        type: choice
        default: baseline
        options:
          - baseline
          - fts_diagnostic
          - source_health_diagnostic
          - source_health_topology_diagnostic
          - index_cost
          - exact_sql_1m_diagnostic
          - covering_indexes

permissions:
  contents: read

concurrency:
  group: global-search-benchmark-${{ github.ref }}-${{ github.event_name == 'pull_request' && github.head_ref == 'fix/issue-359-global-search-source-health-snapshot' && github.event.pull_request.head.repo.full_name == github.repository && 'source_health_topology_diagnostic' || github.event_name == 'pull_request' && github.head_ref == 'research/issue-352-global-search-500k-performance' && github.event.pull_request.head.repo.full_name == github.repository && 'query_cost_diagnostic' || github.event_name == 'pull_request' && 'baseline' || inputs.mode || 'baseline' }}-${{ github.event_name == 'pull_request' && github.head_ref == 'fix/issue-359-global-search-source-health-snapshot' && github.event.pull_request.head.repo.full_name == github.repository && '500000' || inputs.mode == 'source_health_topology_diagnostic' && '500000' || github.event_name == 'pull_request' && github.head_ref == 'research/issue-352-global-search-500k-performance' && github.event.pull_request.head.repo.full_name == github.repository && '500000' || github.event_name == 'pull_request' && '100000' || inputs.entries || '100000' }}
  cancel-in-progress: false

jobs:
  # Keep manual baseline/diagnostic modes and the two branch-scoped diagnostics;
  # ordinary PRs use only the bounded 1k-row smoke in the index-cost job below.
  synthetic-global-search:
    if: ${{ (github.event_name == 'workflow_dispatch' && inputs.mode != 'index_cost' && inputs.mode != 'exact_sql_1m_diagnostic' && inputs.mode != 'covering_indexes') || (github.event_name == 'pull_request' && ((github.head_ref == 'fix/issue-359-global-search-source-health-snapshot' && github.event.pull_request.head.repo.full_name == github.repository) || (github.head_ref == 'research/issue-352-global-search-500k-performance' && github.event.pull_request.head.repo.full_name == github.repository))) }}
    name: Global Search ${{ github.event_name == 'pull_request' && github.head_ref == 'fix/issue-359-global-search-source-health-snapshot' && github.event.pull_request.head.repo.full_name == github.repository && 'source_health_topology_diagnostic' || github.event_name == 'pull_request' && github.head_ref == 'research/issue-352-global-search-500k-performance' && github.event.pull_request.head.repo.full_name == github.repository && 'query_cost_diagnostic' || github.event_name == 'pull_request' && 'baseline' || inputs.mode || 'baseline' }} (${{ github.event_name == 'pull_request' && github.head_ref == 'fix/issue-359-global-search-source-health-snapshot' && github.event.pull_request.head.repo.full_name == github.repository && '500000' || inputs.mode == 'source_health_topology_diagnostic' && '500000' || github.event_name == 'pull_request' && github.head_ref == 'research/issue-352-global-search-500k-performance' && github.event.pull_request.head.repo.full_name == github.repository && '500000' || github.event_name == 'pull_request' && '100000' || inputs.entries || '100000' }} rows)
    runs-on: windows-latest
    timeout-minutes: 180
    env:
      ZC_GLOBAL_SEARCH_BENCHMARK_ENTRIES: ${{ github.event_name == 'pull_request' && github.head_ref == 'fix/issue-359-global-search-source-health-snapshot' && github.event.pull_request.head.repo.full_name == github.repository && '500000' || inputs.mode == 'source_health_topology_diagnostic' && '500000' || github.event_name == 'pull_request' && github.head_ref == 'research/issue-352-global-search-500k-performance' && github.event.pull_request.head.repo.full_name == github.repository && '500000' || github.event_name == 'pull_request' && '100000' || inputs.entries || '100000' }}
      ZC_GLOBAL_SEARCH_BENCHMARK_OUTPUT: ${{ github.workspace }}/ci-evidence/global-search-baseline.jsonl
      ZC_GLOBAL_SEARCH_BENCHMARK_MODE: ${{ github.event_name == 'pull_request' && github.head_ref == 'fix/issue-359-global-search-source-health-snapshot' && github.event.pull_request.head.repo.full_name == github.repository && 'source_health_topology_diagnostic' || github.event_name == 'pull_request' && github.head_ref == 'research/issue-352-global-search-500k-performance' && github.event.pull_request.head.repo.full_name == github.repository && 'query_cost_diagnostic' || github.event_name == 'pull_request' && 'baseline' || inputs.mode || 'baseline' }}
      ZEN_CANVAS_BENCHMARK_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout exact source head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 2
          persist-credentials: false
      - name: Detect changed source-health diagnostic inputs
        if: ${{ github.event_name == 'pull_request' && github.head_ref == 'fix/issue-359-global-search-source-health-snapshot' }}
        id: source-health-scope
        shell: pwsh
        run: |
          $previous = git rev-parse HEAD^
          $changed = git diff --name-only $previous HEAD
          $watched = @(
            'src-tauri/src/global_index/repository.rs',
            'src-tauri/src/global_index/tests.rs',
            'src-tauri/src/global_index/tests/global_search_source_health.rs',
            'src-tauri/src/global_index/tests/global_search_query_cost_diagnostic.rs',
            '.github/workflows/global-search-benchmark.yml'
          )
          $runDiagnostic = $false
          foreach ($file in $watched) {
            if ($changed -contains $file) { $runDiagnostic = $true }
          }
          $value = if ($runDiagnostic) { 'true' } else { 'false' }
          "run_source_health_topology_diagnostic=$value" >> $env:GITHUB_OUTPUT
      - name: Rust cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri -> target
          shared-key: zen-canvas-Windows-global-search-benchmark-v1
          cache-workspace-crates: true
          cache-targets: true
          cache-on-failure: true
      - name: Run official synthetic benchmark and correctness assertions
        if: ${{ env.ZC_GLOBAL_SEARCH_BENCHMARK_MODE == 'baseline' }}
        run: >-
          cargo test --manifest-path src-tauri/Cargo.toml
          --features desktop-runtime
          --lib
          global_index::tests::global_search_benchmark::global_search_synthetic_benchmark_baseline
          -- --ignored --exact --nocapture --test-threads=1
      - name: Run focused FTS query-stage diagnostic
        if: ${{ env.ZC_GLOBAL_SEARCH_BENCHMARK_MODE == 'fts_diagnostic' }}
        run: >-
          cargo test --manifest-path src-tauri/Cargo.toml
          --features desktop-runtime
          --lib
          global_index::tests::global_search_benchmark::fts_diagnostic::global_search_fts_latency_diagnostic
          -- --ignored --exact --nocapture --test-threads=1
      - name: Run single-fixture 500k query-cost diagnostic
        if: ${{ env.ZC_GLOBAL_SEARCH_BENCHMARK_MODE == 'query_cost_diagnostic' }}
        run: >-
          cargo test --manifest-path src-tauri/Cargo.toml
          --features desktop-runtime
          --lib
          global_index::tests::global_search_benchmark::query_cost_diagnostic::global_search_query_cost_diagnostic
          -- --ignored --exact --nocapture --test-threads=1
      - name: Require the fixed 500k source-health fixture
        if: ${{ env.ZC_GLOBAL_SEARCH_BENCHMARK_MODE == 'source_health_diagnostic' }}
        shell: pwsh
        run: |
          if ($env:ZC_GLOBAL_SEARCH_BENCHMARK_ENTRIES -ne '500000') {
            throw 'Source-health diagnostic is fixed at 500,000 rows.'
          }
      - name: Run source-health candidates on the reused 500k fixture
        if: ${{ env.ZC_GLOBAL_SEARCH_BENCHMARK_MODE == 'source_health_diagnostic' && (github.event_name != 'pull_request' || github.head_ref != 'fix/issue-359-global-search-source-health-snapshot' || steps.source-health-scope.outputs.run_source_health_diagnostic == 'true') }}
        run: >-
          cargo test --manifest-path src-tauri/Cargo.toml
          --features desktop-runtime
          --lib
          global_index::tests::global_search_benchmark::query_cost_diagnostic::global_search_query_cost_diagnostic
          -- --ignored --exact --nocapture --test-threads=1
      - name: Require the fixed 500k Owner topology fixture
        if: ${{ env.ZC_GLOBAL_SEARCH_BENCHMARK_MODE == 'source_health_topology_diagnostic' }}
        shell: pwsh
        run: |
          if ($env:ZC_GLOBAL_SEARCH_BENCHMARK_ENTRIES -ne '500000') {
            throw 'Owner topology qualification is fixed at exactly 500,000 rows.'
          }
      - name: Run focused Owner 500k topology qualification
        if: ${{ env.ZC_GLOBAL_SEARCH_BENCHMARK_MODE == 'source_health_topology_diagnostic' && (github.event_name != 'pull_request' || github.head_ref != 'fix/issue-359-global-search-source-health-snapshot' || steps.source-health-scope.outputs.run_source_health_topology_diagnostic == 'true') }}
        run: >-
          cargo test --manifest-path src-tauri/Cargo.toml
          --features desktop-runtime
          --lib
          global_index::tests::global_search_benchmark::query_cost_diagnostic::global_search_source_health_topology_diagnostic
          -- --ignored --exact --nocapture --test-threads=1
      - name: Upload benchmark evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: global-search-${{ env.ZC_GLOBAL_SEARCH_BENCHMARK_MODE }}-${{ env.ZC_GLOBAL_SEARCH_BENCHMARK_ENTRIES }}-rows-${{ github.run_id }}
          path: ci-evidence/global-search-baseline.jsonl
          if-no-files-found: warn
          retention-days: 30

  synthetic-global-index-cost:
    if: ${{ github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && inputs.mode == 'index_cost') }}
    name: ISG-00E ingestion cost (${{ matrix.runner_key }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            runner_key: windows
          - os: macos-latest
            runner_key: macos
    runs-on: ${{ matrix.os }}
    timeout-minutes: 180
    env:
      ZC_GLOBAL_INDEX_COST_BENCHMARK_ENTRIES: ${{ github.event_name == 'pull_request' && '1000' || inputs.cost_entries || '100000' }}
      ZEN_CANVAS_BENCHMARK_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout exact source head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 2
          persist-credentials: false
      - name: Record exact Windows source tree
        if: ${{ runner.os == 'Windows' }}
        shell: pwsh
        run: |
          $sourceTree = git rev-parse 'HEAD^{tree}'
          "ZEN_CANVAS_BENCHMARK_SOURCE_TREE=$sourceTree" >> $env:GITHUB_ENV
      - name: Record exact macOS source tree
        if: ${{ runner.os == 'macOS' }}
        shell: bash
        run: |
          source_tree="$(git rev-parse 'HEAD^{tree}')"
          echo "ZEN_CANVAS_BENCHMARK_SOURCE_TREE=$source_tree" >> "$GITHUB_ENV"
      - name: Rust cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri -> target
          shared-key: zen-canvas-${{ matrix.runner_key }}-global-index-cost-v1
          cache-workspace-crates: true
          cache-targets: true
          cache-on-failure: true
      - name: Run the 1k-row ingestion-cost smoke fixture first
        env:
          ZC_GLOBAL_INDEX_COST_BENCHMARK_OUTPUT: ${{ runner.temp }}/global-index-cost-${{ matrix.runner_key }}-smoke.jsonl
        run: >-
          cargo test --manifest-path src-tauri/Cargo.toml
          --features desktop-runtime
          --lib
          global_index::tests::global_search_benchmark::index_cost_benchmark::global_search_index_cost_benchmark_smoke
          -- --exact --nocapture --test-threads=1
      - name: Run configured paired A/B/C/D ingestion-cost experiment and search checks
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'index_cost' }}
        env:
          ZC_GLOBAL_INDEX_COST_BENCHMARK_OUTPUT: ${{ runner.temp }}/global-index-cost-${{ matrix.runner_key }}.jsonl
        run: >-
          cargo test --manifest-path src-tauri/Cargo.toml
          --features desktop-runtime
          --lib
          global_index::tests::global_search_benchmark::index_cost_benchmark::global_search_index_cost_synthetic_benchmark
          -- --ignored --exact --nocapture --test-threads=1
      - name: Upload raw ISG-00E evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: isg-00e-${{ matrix.runner_key }}-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/global-index-cost-${{ matrix.runner_key }}-smoke.jsonl
            ${{ runner.temp }}/global-index-cost-${{ matrix.runner_key }}.jsonl
          if-no-files-found: warn
          retention-days: 90

  synthetic-global-search-exact-sql-diagnostic:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'exact_sql_1m_diagnostic' }}
    name: Global Search exact SQL 1M diagnostic (test-only)
    runs-on: windows-latest
    timeout-minutes: 45
    concurrency:
      group: global-search-exact-sql-1m-diagnostic-${{ github.repository }}
      cancel-in-progress: false
    env:
      ZC_GLOBAL_SEARCH_EXACT_SQL_DIAGNOSTIC_ENTRIES: "1000000"
      ZC_GLOBAL_SEARCH_EXACT_SQL_DIAGNOSTIC_MODE: ${{ inputs.mode }}
    steps:
      - name: Checkout exact dispatch ref
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false
      - name: Rust cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri -> target
          shared-key: zen-canvas-Windows-global-search-exact-sql-1m-v1
          cache-workspace-crates: true
          cache-targets: true
          cache-on-failure: true
      - name: Record exact source and enforce measured runner budgets
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $sourceSha = (git rev-parse HEAD).Trim()
          $sourceTree = (git rev-parse 'HEAD^{tree}').Trim()
          if ($sourceSha -ne '${{ github.sha }}') { throw 'Checked out source does not match the dispatched SHA.' }

          $os = Get-CimInstance Win32_OperatingSystem
          $totalMemoryBytes = [long]$os.TotalVisibleMemorySize * 1024
          $freeMemoryBytes = [long]$os.FreePhysicalMemory * 1024
          # Preserve the known-good 1M baseline's workspace-local SQLite temp path.
          # The system TEMP drive may have very different Hosted Windows I/O behavior.
          $databaseTempRoot = Join-Path $env:GITHUB_WORKSPACE '.performance-temp'
          New-Item -ItemType Directory -Force -Path $databaseTempRoot | Out-Null
          $databaseTempRoot = (Resolve-Path -LiteralPath $databaseTempRoot).ProviderPath.TrimEnd([char[]]@('\', '/'))
          # Propagate to later steps: preflight budgets and Rust temp_dir must agree.
          "TEMP=$databaseTempRoot" >> $env:GITHUB_ENV
          "TMP=$databaseTempRoot" >> $env:GITHUB_ENV
          $databaseTempDrive = Get-PSDrive -Name ($databaseTempRoot.Substring(0, 1))
          $freeDiskBytes = [long]$databaseTempDrive.Free
          $evidenceTempRoot = $env:RUNNER_TEMP.TrimEnd([char[]]@('\', '/'))
          $evidenceTempDrive = Get-PSDrive -Name ($evidenceTempRoot.Substring(0, 1))
          $freeEvidenceDiskBytes = [long]$evidenceTempDrive.Free
          if ($totalMemoryBytes -le 0 -or $freeMemoryBytes -le 0) { throw 'Could not measure Windows runner physical memory.' }
          if ($freeMemoryBytes -lt 1073741824) { throw 'Fail-closed preflight: less than 1 GiB physical memory is available.' }
          if ($freeDiskBytes -lt 4294967296) { throw 'Fail-closed preflight: less than 4 GiB disk space is available on the test temp drive.' }
          if ($freeEvidenceDiskBytes -lt 1073741824) { throw 'Fail-closed preflight: less than 1 GiB disk space is available for evidence files.' }

          $maxWorkingSetBytes = [long][Math]::Floor($freeMemoryBytes * 0.70)
          $maxDatabaseBytes = [long][Math]::Floor($freeDiskBytes * 0.50)
          if ($maxWorkingSetBytes -le 0 -or $maxDatabaseBytes -le 0 -or $maxDatabaseBytes -ge $freeDiskBytes) {
            throw 'Could not derive enforceable memory and database budgets from the measured runner.'
          }

          "ZEN_CANVAS_BENCHMARK_SOURCE_SHA=$sourceSha" >> $env:GITHUB_ENV
          "ZEN_CANVAS_BENCHMARK_SOURCE_TREE=$sourceTree" >> $env:GITHUB_ENV
          "ZC_GLOBAL_SEARCH_EXACT_SQL_DIAGNOSTIC_TOTAL_MEMORY_BYTES=$totalMemoryBytes" >> $env:GITHUB_ENV
          "ZC_GLOBAL_SEARCH_EXACT_SQL_DIAGNOSTIC_FREE_MEMORY_BYTES=$freeMemoryBytes" >> $env:GITHUB_ENV
          "ZC_GLOBAL_SEARCH_EXACT_SQL_DIAGNOSTIC_FREE_DISK_BYTES=$freeDiskBytes" >> $env:GITHUB_ENV
          "ZC_GLOBAL_SEARCH_EXACT_SQL_DIAGNOSTIC_FREE_EVIDENCE_DISK_BYTES=$freeEvidenceDiskBytes" >> $env:GITHUB_ENV
          "ZC_GLOBAL_SEARCH_EXACT_SQL_DIAGNOSTIC_MAX_WORKING_SET_BYTES=$maxWorkingSetBytes" >> $env:GITHUB_ENV
          "ZC_GLOBAL_SEARCH_EXACT_SQL_DIAGNOSTIC_MAX_DATABASE_BYTES=$maxDatabaseBytes" >> $env:GITHUB_ENV
          "ZC_GLOBAL_SEARCH_EXACT_SQL_DIAGNOSTIC_TEMP_ROOT=$databaseTempRoot" >> $env:GITHUB_ENV

          $budgetSummary = @(
            "source_sha=$sourceSha"
            "source_tree=$sourceTree"
            "runner_total_physical_memory_bytes=$totalMemoryBytes"
            "runner_free_physical_memory_bytes=$freeMemoryBytes"
            "test_process_working_set_limit_bytes=$maxWorkingSetBytes"
            "database_temp_drive=$($databaseTempRoot.Substring(0, 1))"
            "database_temp_drive_free_bytes=$freeDiskBytes"
            "evidence_temp_drive=$($evidenceTempRoot.Substring(0, 1))"
            "evidence_temp_drive_free_bytes=$freeEvidenceDiskBytes"
            "database_main_wal_shm_limit_bytes=$maxDatabaseBytes"
            'evidence_jsonl_combined_limit_bytes=33554432'
            'soft_elapsed_limit_seconds=1800'
            'job_timeout_minutes=45'
          ) -join [Environment]::NewLine
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value $budgetSummary
      - name: Record Rust build identity
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $rustcVersion = (rustc --version).Trim()
          $cargoVersion = (cargo --version).Trim()
          "ZEN_CANVAS_RUSTC_VERSION=$rustcVersion" >> $env:GITHUB_ENV
          "ZEN_CANVAS_CARGO_VERSION=$cargoVersion" >> $env:GITHUB_ENV
          "rustc=$rustcVersion`ncargo=$cargoVersion" | Add-Content $env:GITHUB_STEP_SUMMARY
      - name: Run the single ignored exact SQL 1M diagnostic
        id: run-exact-sql-diagnostic
        timeout-minutes: 40
        env:
          ZC_GLOBAL_SEARCH_EXACT_SQL_DIAGNOSTIC_OUTPUT: ${{ runner.temp }}/global-search-exact-sql-1m.jsonl
          ZC_GLOBAL_SEARCH_BENCHMARK_OUTPUT: ${{ runner.temp }}/global-search-exact-sql-1m-semantic.jsonl
        run: >-
          cargo test --manifest-path src-tauri/Cargo.toml
          --features desktop-runtime
          --lib
          global_index::tests::global_search_benchmark::query_cost_diagnostic::global_search_exact_sql_1m_diagnostic
          -- --ignored --exact --nocapture --test-threads=1
      - name: Verify terminal evidence and write SHA-256
        if: ${{ always() }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $mainEvidence = Join-Path $env:RUNNER_TEMP 'global-search-exact-sql-1m.jsonl'
          $semanticEvidence = Join-Path $env:RUNNER_TEMP 'global-search-exact-sql-1m-semantic.jsonl'
          $hashManifest = Join-Path $env:RUNNER_TEMP 'global-search-exact-sql-1m.sha256'
          $hashLines = @()
          $totalBytes = 0L
          foreach ($path in @($mainEvidence, $semanticEvidence)) {
            if (Test-Path $path) {
              $length = (Get-Item $path).Length
              $totalBytes += $length
              $hash = (Get-FileHash -Algorithm SHA256 $path).Hash.ToLowerInvariant()
              $hashLines += "$hash  $(Split-Path $path -Leaf)"
              "$(Split-Path $path -Leaf)_bytes=$length sha256=$hash" | Add-Content $env:GITHUB_STEP_SUMMARY
            }
          }
          Set-Content -Path $hashManifest -Value $hashLines
          if ($totalBytes -gt 33554432) { throw "Combined JSONL evidence exceeded 32 MiB: $totalBytes bytes." }

          $terminalStatus = 'MISSING'
          if (Test-Path $mainEvidence) {
            $records = Get-Content $mainEvidence | ForEach-Object { $_ | ConvertFrom-Json }
            $terminal = $records | Where-Object { $_.record_type -eq 'diagnostic_terminal' } | Select-Object -Last 1
            if ($null -ne $terminal) { $terminalStatus = [string]$terminal.status }
          }
          "terminal_status=$terminalStatus`ntest_step_outcome=${{ steps.run-exact-sql-diagnostic.outcome }}`ncombined_jsonl_bytes=$totalBytes" | Add-Content $env:GITHUB_STEP_SUMMARY
          if ('${{ steps.run-exact-sql-diagnostic.outcome }}' -ne 'success') { throw 'The exact SQL 1M diagnostic step did not succeed.' }
          if ($terminalStatus -ne 'PASS') { throw "Terminal evidence is $terminalStatus; incomplete evidence cannot PASS." }
          if ($hashLines.Count -ne 2) { throw 'Both main and semantic JSONL evidence files and hashes are required.' }
      - name: Upload partial or complete exact SQL evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: global-search-exact-sql-1m-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/global-search-exact-sql-1m.jsonl
            ${{ runner.temp }}/global-search-exact-sql-1m-semantic.jsonl
            ${{ runner.temp }}/global-search-exact-sql-1m.sha256
          if-no-files-found: warn
          retention-days: 90

  covering-index-pair:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'covering_indexes' }}
    name: Covering indexes paired (${{ inputs.entries }} rows)
    runs-on: windows-latest
    timeout-minutes: 180
    env:
      ZC_GLOBAL_SEARCH_BENCHMARK_ENTRIES: ${{ inputs.entries }}
      ZC_GLOBAL_SEARCH_BENCHMARK_OUTPUT: ${{ runner.temp }}/covering-index-pair.jsonl
      ZEN_CANVAS_BENCHMARK_SOURCE_SHA: ${{ github.sha }}
    steps:
      - name: Checkout exact source head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Check bounded scale and record identity
        shell: pwsh
        run: |
          if ($env:ZC_GLOBAL_SEARCH_BENCHMARK_ENTRIES -notin @('100000','1000000')) { throw 'Only 100k preflight or one controlled 1M run is supported.' }
          $tree = git rev-parse 'HEAD^{tree}'
          "ZEN_CANVAS_BENCHMARK_SOURCE_TREE=$tree" >> $env:GITHUB_ENV
          "source=${{ github.sha }} tree=$tree" >> $env:GITHUB_STEP_SUMMARY
          $drive = Get-PSDrive -Name $env:RUNNER_TEMP.Substring(0,1)
          if ($drive.Free -lt 10GB) { throw 'Need 10 GiB free for controlled SQLite copies.' }
      - name: Rust cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri -> target
          shared-key: zen-canvas-Windows-global-search-benchmark-v1
          cache-workspace-crates: true
          cache-targets: true
          cache-on-failure: true
      - name: Schema 43 migration and rollback checks
        run: cargo test --manifest-path src-tauri/Cargo.toml --features desktop-runtime --lib schema43 -- --nocapture --test-threads=1
      - name: Existing source semantics and concurrent transaction checks
        run: cargo test --manifest-path src-tauri/Cargo.toml --features desktop-runtime --lib global_search_source_health -- --nocapture --test-threads=1
      - name: Hostile covering-index contract check
        run: cargo test --manifest-path src-tauri/Cargo.toml --features desktop-runtime --lib global_index::tests::global_search_benchmark::covering_indexes::covering_indexes_preserve_hostile_source_and_search_contracts -- --exact --nocapture --test-threads=1
      - name: Run single-fixture covering-index pair
        run: >-
          cargo test --manifest-path src-tauri/Cargo.toml --features desktop-runtime --lib
          global_index::tests::global_search_benchmark::covering_indexes::global_search_covering_index_pair
          -- --ignored --exact --nocapture --test-threads=1
      - name: Upload complete or partial paired evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: covering-index-pair-${{ inputs.entries }}-${{ github.run_id }}
          path: ${{ runner.temp }}/covering-index-pair.jsonl
          if-no-files-found: warn
          retention-days: 90
