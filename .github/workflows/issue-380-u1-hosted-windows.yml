name: Issue 380 U1 Windows upgrade compatibility gate

on:
  push:
    branches:
      - research/issue-380-u1-windows-upgrade-gate

permissions:
  contents: read

concurrency:
  group: issue-380-u1-${{ github.ref }}
  cancel-in-progress: false

jobs:
  hosted-windows-upgrade-gate:
    name: Frozen old and D1-A binaries / disposable Windows upgrade
    runs-on: windows-latest
    timeout-minutes: 240
    steps:
      - name: Checkout U1 harness
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node for Windows packaging
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24

      - name: Rust cache for exact old and D1-A candidates
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri -> target
          shared-key: issue-380-u1-windows-old-d1a-v1
          cache-workspace-crates: true
          cache-targets: true
          cache-on-failure: true

      - name: Run exact-source Hosted Windows compatibility gate
        shell: pwsh
        env:
          U1_OLD_SHA: 3275ac7c72df8ae4139a30f16c7f649971324e97
          U1_OLD_TREE: 009576241cd4e8e2ba12cc644a368314f599faa6
          U1_D1A_SHA: d260131f9d6ec354f2361e6c7460c79e62e38391
          U1_D1A_TREE: 4765285668095fb3d7c0dcefd8a8ba5f2bd4fb69
        run: ./scripts/issue380U1HostedWindows.ps1 -EvidenceRoot "${{ runner.temp }}/issue-380-u1-evidence-${{ github.run_id }}-${{ github.run_attempt }}"

      - name: Upload raw U1 Windows evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: issue-380-u1-hosted-windows-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/issue-380-u1-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: warn
          retention-days: 30
