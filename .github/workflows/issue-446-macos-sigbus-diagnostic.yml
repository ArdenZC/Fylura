          import os
          import signal
          import subprocess
          import sys
          import time

          evidence = os.environ["ISSUE446_EVIDENCE"]
          work = os.environ["ISSUE446_WORK"]
          active_session_path = os.environ["ISSUE446_ACTIVE_LLDB_SESSION_FILE"]
          with open(os.environ["ISSUE446_START_FILE"], encoding="ascii") as stream:
