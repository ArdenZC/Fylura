                  temp = path + ".tmp"
                  with open(temp, "w", encoding="utf-8") as stream:
                      stream.write(value + "\n")
                      stream.flush()
                      os.fsync(stream.fileno())
                  os.replace(temp, path)

          def active_lldb_session():
              try:
                  with open(active_session_path, encoding="ascii") as stream:
                      session = int(stream.read().strip())
                  return session if session > 1 else None
              except (OSError, ValueError):
                  return None

          def process_snapshot():
              errors = []
              for field in ("sess", "sid"):
                  try:
                      result = subprocess.run(
                          ["/bin/ps", "-axo", "pid=,ppid=,pgid=,%s=" % field],
                          check=True, capture_output=True, text=True, timeout=3)
                      processes = {}
                      for line in result.stdout.splitlines():
                          columns = line.split()
                          if len(columns) != 4 or not all(value.isdigit() for value in columns):
                              continue
                          pid, ppid, pgid, sid = map(int, columns)
                          processes[pid] = {"ppid": ppid, "pgid": pgid, "sid": sid}
                      if not processes or not any(item["sid"] > 1 for item in processes.values()):
                          raise RuntimeError("process snapshot was empty or had no session ids")
                      return processes
                  except Exception as error:
                      errors.append(type(error).__name__)
              raise RuntimeError("process snapshot unavailable: " + ",".join(errors))

          def descendants(processes, roots):
              found = set()
              pending = list(roots)
              while pending:
                  parent = pending.pop()
                  for pid, item in processes.items():
                      if item["ppid"] == parent and pid not in found:
                          found.add(pid)
                          pending.append(pid)
              return found

          def group_alive(pgid):
              try:
                  os.killpg(pgid, 0)
                  return True
              except ProcessLookupError:
                  return False
              except PermissionError:
                  return True

          def cleanup_snapshot(signum):
              session = active_lldb_session()
              sessions = {child.pid}
              if session is not None:
                  sessions.add(session)
              snapshot = process_snapshot()
              members = {pid for pid, item in snapshot.items() if item["sid"] in sessions}
              descendants_found = descendants(snapshot, sessions)
              groups = {child.pid}
              groups.update(item["pgid"] for pid, item in snapshot.items()
                            if item["sid"] in sessions and item["pgid"] > 1)
              groups.update(snapshot[pid]["pgid"] for pid in descendants_found if pid in snapshot)
              for pgid in groups:
                  try:
                      os.killpg(pgid, signum)
                  except ProcessLookupError:
                      pass
              for pid in descendants_found:
                  try:
                      os.kill(pid, signum)
                  except ProcessLookupError:
                      pass
              return session, snapshot, members, descendants_found, groups

          def cleanup_status(session):
              try:
                  snapshot = process_snapshot()
              except RuntimeError:
                  return False, False
              sessions = {child.pid}
              if session is not None:
                  sessions.add(session)
              members = {pid for pid, item in snapshot.items() if item["sid"] in sessions}
              descendants_found = descendants(snapshot, sessions)
              groups = {item["pgid"] for pid, item in snapshot.items()
                        if item["sid"] in sessions and item["pgid"] > 1}
              groups.add(child.pid)
              alive_groups = any(group_alive(pgid) for pgid in groups)
              complete = not members and not descendants_found and not alive_groups
              return complete, True

          def record_cleanup(reason, confirmed, child_reaped, snapshot_available):
              with open(cleanup_path, "a", encoding="utf-8") as stream:
                  stream.write(
                      "supervisor_cleanup=%s; body_child_reaped=%s; process_snapshot=%s; reason=%s\n" %
                      ("CONFIRMED" if confirmed else "UNVERIFIED",
                       "true" if child_reaped else "false",
                       "available" if snapshot_available else "UNAVAILABLE", reason))
                  stream.flush()
                  os.fsync(stream.fileno())

          def terminate_group(reason, grace_seconds=6):
              if child is None:
                  record_cleanup(reason, True, True, True)
                  return True
              snapshot_available = True
              session = active_lldb_session()
              try:
                  cleanup_snapshot(signal.SIGTERM)
              except RuntimeError:
                  snapshot_available = False
                  for pgid in [child.pid, session]:
                      if pgid is not None:
                          try:
                              os.killpg(pgid, signal.SIGTERM)
                          except ProcessLookupError:
                              pass
              group_deadline = time.monotonic() + grace_seconds
              confirmed = False
              while time.monotonic() < group_deadline:
                  try:
                      session = active_lldb_session() or session
                      cleanup_snapshot(signal.SIGTERM)
                      confirmed, available = cleanup_status(session)
                      snapshot_available = snapshot_available and available
                      if confirmed and child.poll() is not None:
                          break
                  except RuntimeError:
                      snapshot_available = False
                  time.sleep(0.1)
              if not confirmed or child.poll() is None:
                  try:
                      cleanup_snapshot(signal.SIGKILL)
                  except RuntimeError:
                      snapshot_available = False
                      for pgid in [child.pid, session]:
                          if pgid is not None:
                              try:
                                  os.killpg(pgid, signal.SIGKILL)
                              except ProcessLookupError:
                                  pass
              try:
                  child.wait(timeout=4)
                  child_reaped = True
              except subprocess.TimeoutExpired:
                  child_reaped = False
                  try:
                      os.killpg(child.pid, signal.SIGKILL)
                  except ProcessLookupError:
                      pass
                  try:
                      child.wait(timeout=2)
                      child_reaped = True
                  except subprocess.TimeoutExpired:
                      pass
              verify_deadline = time.monotonic() + 2
              while time.monotonic() < verify_deadline:
                  try:
                      session = active_lldb_session() or session
                      confirmed, available = cleanup_status(session)
                      snapshot_available = snapshot_available and available
                      if confirmed and child_reaped:
                          break
                      cleanup_snapshot(signal.SIGKILL)
                  except RuntimeError:
                      snapshot_available = False
                      confirmed = False
                  time.sleep(0.1)
              confirmed = confirmed and child_reaped and snapshot_available
              if confirmed and session is not None:
                  try:
                      os.unlink(active_session_path)
                  except FileNotFoundError:
                      pass
              record_cleanup(reason, confirmed, child_reaped, snapshot_available)
              helper_cleanup_path = os.path.join(work, "process-cleanup.log")
              try:
                  with open(helper_cleanup_path, encoding="utf-8") as source:
                      helper_cleanup = source.read()
                  with open(cleanup_path, "a", encoding="utf-8") as destination:
                      destination.write(helper_cleanup)
              except OSError:
                  pass
              return confirmed

          def on_signal(signum, _frame):
              cleanup_confirmed = terminate_group("supervisor_signal_%d" % signum)
              suffix = "cleanup_confirmed" if cleanup_confirmed else "cleanup_unverified"
              set_result("TIMEOUT", "diagnostic_step_interrupted_signal_%d_%s" % (signum, suffix))
              raise SystemExit(128 + signum)

          signal.signal(signal.SIGTERM, on_signal)
          signal.signal(signal.SIGINT, on_signal)
          remaining = deadline - time.time()
          if remaining <= 0:
              record_cleanup("11_minute_deadline_before_body", True, True, True)
              set_result("TIMEOUT", "11_minute_job_deadline_reached_before_body")
              raise SystemExit(124)

          try:
              with open(log_path, "ab", buffering=0) as output:
                  prior_mask = signal.pthread_sigmask(
                      signal.SIG_BLOCK, {signal.SIGTERM, signal.SIGINT})
                  child = subprocess.Popen(
                      ["/bin/bash", "-e", "-u", "-o", "pipefail", os.path.join(work, "body.sh")],
                      cwd=os.environ["GITHUB_WORKSPACE"],
                      stdout=output,
                      stderr=subprocess.STDOUT,
                      start_new_session=True,
                  )
                  signal.pthread_sigmask(signal.SIG_SETMASK, prior_mask)
                  try:
                      return_code = child.wait(timeout=remaining)
                  except subprocess.TimeoutExpired:
                      cleanup_confirmed = terminate_group("11_minute_deadline", grace_seconds=6)
                      suffix = "cleanup_confirmed" if cleanup_confirmed else "cleanup_unverified"
                      set_result("TIMEOUT", "11_minute_diagnostic_body_deadline_reached_%s" % suffix)
                      raise SystemExit(124)
          except SystemExit:
              raise
          except Exception as error:
              cleanup_confirmed = terminate_group("supervisor_exception_%s" % type(error).__name__)
              suffix = "cleanup_confirmed" if cleanup_confirmed else "cleanup_unverified"
              set_result("OTHER_FAILURE", "supervisor_exception_%s_%s" % (type(error).__name__, suffix))
              raise SystemExit(1)

          cleanup_confirmed = terminate_group("body_exit_%d" % child.returncode, grace_seconds=2)

          if child.returncode != 0:
              current = ""
              try:
                  with open(result_path, encoding="utf-8") as stream:
                      current = stream.read().strip()
              except OSError:
                  pass
              if current == "OTHER_FAILURE":
                  set_result("OTHER_FAILURE", "diagnostic_body_exit_%d" % child.returncode)
          helper_cleanup_path = os.path.join(work, "process-cleanup.log")
          try:
              with open(helper_cleanup_path, encoding="utf-8") as source:
                  helper_cleanup = source.read()
          except OSError:
              helper_cleanup = ""
          if not cleanup_confirmed or "lldb_session_cleanup=UNVERIFIED" in helper_cleanup:
              current = ""
              try:
                  with open(result_path, encoding="utf-8") as stream:
                      current = stream.read().strip()
              except OSError:
                  pass
              if current in ("", "OTHER_FAILURE", "NON_REPRODUCED"):
                  set_result("OTHER_FAILURE", "process_cleanup_unverified_after_diagnostic_body")
          with open(os.path.join(work, "diagnostic-body-exit-code.txt"), "w", encoding="ascii") as stream:
              stream.write(str(child.returncode) + "\n")
          raise SystemExit(0)
          PY

          python3 "$ISSUE446_WORK/supervisor.py"

      - name: Sanitize and bound diagnostic evidence
        if: always()
        timeout-minutes: 2
        shell: bash
        env:
          ISSUE446_EVIDENCE: ${{ runner.temp }}/issue446-evidence
          ISSUE446_WORK: ${{ runner.temp }}/issue446-work
        run: |
          set -euo pipefail
          python3 - "$ISSUE446_EVIDENCE" "$ISSUE446_WORK" "$GITHUB_WORKSPACE" "$RUNNER_TEMP" "$HOME" <<'PY'
          import json
          import os
          import pathlib
          import re
          import sys

          evidence = pathlib.Path(sys.argv[1])
          work = pathlib.Path(sys.argv[2])
          roots = [sys.argv[3], sys.argv[4], sys.argv[5], "/Users/runner"]
          limit = 5 * 1024 * 1024
          per_log_limits = {
              "diagnostic-body.raw.log": 256 * 1024,
              "preflight.raw.log": 1024 * 1024,
              "test.raw.log": 2 * 1024 * 1024,
              "process-cleanup.log": 128 * 1024,
              "cargo-build.stderr": 512 * 1024,
              "fixture-build.log": 128 * 1024,
          }

          def redact(text):
              for root, replacement in zip(roots, ("<WORKSPACE>", "<RUNNER_TEMP>", "<HOME>", "<RUNNER_HOME>")):
                  if root:
                      text = text.replace(root, replacement)
              text = re.sub(r"(?i)(authorization:\s*bearer)\s+\S+", r"\1 <REDACTED>", text)
              text = re.sub(r"\bgh[pousr]_[A-Za-z0-9_]{20,}\b", "<REDACTED_TOKEN>", text)
              text = re.sub(r"(?i)(https?://)[^/@\s:]+:[^/@\s]+@", r"\1<REDACTED>@", text)
              text = re.sub(r"(?i)\b(token|password|secret|api[_-]?key)\s*[:=]\s*([^\s,;]+)", r"\1=<REDACTED>", text)
              return text

          def bounded_text(source, destination, max_bytes):
              if not source.is_file():
                  return
              text = source.read_text(encoding="utf-8", errors="replace")
              text = redact(text)
              data = text.encode("utf-8", errors="replace")
              if len(data) > max_bytes:
                  marker = b"\n<TRUNCATED: evidence size cap>\n"
                  tail = max_bytes - len(marker)
                  data = marker + data[-tail:]
              destination.write_bytes(data)

          copies = {
              "diagnostic-body.raw.log": "diagnostic-body.log",
              "preflight.raw.log": "preflight.log",
              "test.raw.log": "rust-test-lldb.log",
              "process-cleanup.log": "lldb-process-cleanup.log",
              "cargo-build.stderr": "cargo-build.stderr",
              "fixture-build.log": "fixture-build.log",
          }
          for source_name, destination_name in copies.items():
              bounded_text(work / source_name, evidence / destination_name, per_log_limits[source_name])

          for name in (
              "source.txt", "runner.txt", "admission.txt", "classification.txt",
              "result-reason.txt", "rustc.txt", "cargo.txt", "clang.txt",
              "lldb-version.txt", "hook-mode.txt", "preflight-exit-code.txt",
              "test-exit-code.txt", "test-metadata.txt", "test-binary-size.txt",
              "preflight-launch.txt", "test-launch.txt", "normal-result.txt",
              "rust-target-started.txt", "diagnostic-body-exit-code.txt",
          ):
              source = evidence / name
              if not source.is_file():
                  source = work / name
              if source.is_file() and source.parent != evidence:
                  bounded_text(source, evidence / name, 64 * 1024)

          start_path = evidence / "job-start-epoch"
          try:
              start_epoch = int(start_path.read_text(encoding="ascii").strip())
          except (OSError, ValueError):
              start_epoch = 0

          report_roots = [
              pathlib.Path.home() / "Library/Logs/DiagnosticReports",
              pathlib.Path("/Library/Logs/DiagnosticReports"),
          ]
          ips_count = 0
          for root in report_roots:
              if not root.is_dir():
                  continue
              for path in root.glob("*zen_canvas_tauri*.ips"):
                  try:
                      stat = path.stat()
                      if stat.st_mtime < start_epoch or stat.st_size > 1024 * 1024:
                          continue
                      records = []
                      for line in path.read_text(encoding="utf-8", errors="replace").splitlines():
                          try:
                              payload = json.loads(line)
                          except ValueError:
                              continue
                          records.append(json.loads(redact(json.dumps(payload, ensure_ascii=False))))
                      if not records:
                          continue
                      report = "\n".join(json.dumps(record, ensure_ascii=False) for record in records) + "\n"
                      if len(report.encode("utf-8")) > 1024 * 1024:
                          continue
                      (evidence / ("macos-report-%d.ips" % ips_count)).write_text(report, encoding="utf-8")
                      ips_count += 1
                      if ips_count >= 1:
                          break
                  except (OSError, ValueError, json.JSONDecodeError):
                      continue
              if ips_count:
                  break
          (evidence / "macos-report-status.txt").write_text(
              "matching_ips=%d; per_file_limit_bytes=1048576; core_files_uploaded=0\n" % ips_count,
              encoding="utf-8")

          for path in list(evidence.iterdir()):
              if path.name in {"job-start-epoch"}:
                  path.unlink(missing_ok=True)
          total = sum(path.stat().st_size for path in evidence.iterdir() if path.is_file())
          if total > limit - 4096:
              for name in (
                  "fixture-build.log", "cargo-build.stderr", "diagnostic-body.log",
                  "preflight.log", "rust-test-lldb.log",
              ):
                  path = evidence / name
                  if path.exists() and total > limit - 4096:
                      path.unlink()
                      total = sum(p.stat().st_size for p in evidence.iterdir() if p.is_file())
          if total > limit - 4096:
              for path in evidence.iterdir():
                  if path.name.startswith("macos-report-"):
                      path.unlink()
              total = sum(path.stat().st_size for path in evidence.iterdir() if path.is_file())
          if total > limit - 4096:
              for path in evidence.iterdir():
                  if path.name not in {
                      "classification.txt", "result-reason.txt", "source.txt", "runner.txt",
                      "admission.txt", "rustc.txt", "cargo.txt", "clang.txt",
                      "lldb-version.txt", "hook-mode.txt", "preflight-exit-code.txt",
                      "test-exit-code.txt", "test-metadata.txt", "test-binary-size.txt",
                      "macos-report-status.txt",
                  }:
                      path.unlink(missing_ok=True)
              total = sum(path.stat().st_size for path in evidence.iterdir() if path.is_file())
          if total > limit - 4096:
              raise SystemExit("sanitized metadata exceeded 5 MiB cap")
          size_path = evidence / "artifact-size.txt"
          size_path.write_text("pending\n", encoding="ascii")
          total = sum(path.stat().st_size for path in evidence.iterdir() if path.is_file())
          size_path.write_text("bytes=%d\nlimit_bytes=%d\n" % (total, limit), encoding="ascii")
          final_total = sum(path.stat().st_size for path in evidence.iterdir() if path.is_file())
          if final_total > limit:
              raise SystemExit("sanitized evidence exceeded 5 MiB cap after size manifest")
          if final_total != total:
              size_path.write_text("bytes=%d\nlimit_bytes=%d\n" % (final_total, limit), encoding="ascii")
          PY

      - name: Upload bounded diagnostic evidence
        if: always()
        timeout-minutes: 1
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: issue-446-macos-sigbus-${{ github.run_id }}
          path: ${{ runner.temp }}/issue446-evidence
          if-no-files-found: warn
          retention-days: 7
          compression-level: 6

      - name: Report diagnostic classification
        if: always()
        timeout-minutes: 1
        shell: bash
        env:
          ISSUE446_EVIDENCE: ${{ runner.temp }}/issue446-evidence
        run: |
          set -euo pipefail
          classification="$(cat "$ISSUE446_EVIDENCE/classification.txt" 2>/dev/null || printf 'OTHER_FAILURE')"
          reason="$(cat "$ISSUE446_EVIDENCE/result-reason.txt" 2>/dev/null || printf 'evidence_or_diagnostic_step_incomplete')"
          {
            printf '### Issue #446 diagnostic result\n\n'
            printf -- '- Classification: `%s`\n' "$classification"
            printf -- '- Reason: `%s`\n' "$reason"
            printf '%s\n' '- This manual diagnostic result does not waive Full Validation or resolve Issue #446.'
          } >> "$GITHUB_STEP_SUMMARY"
          exit 1
