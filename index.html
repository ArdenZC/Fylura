<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      (() => {
        try {
          const storedTheme = localStorage.getItem("zc-theme");
          const prefersDark = window.matchMedia?.("(prefers-color-scheme: dark)")?.matches;
          const useDark = storedTheme === "dark" || (storedTheme !== "light" && prefersDark);
          document.documentElement.classList.toggle("dark", Boolean(useDark));
        } catch {
          document.documentElement.classList.remove("dark");
        }
      })();
    </script>
    <link rel="icon" href='data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64"><rect width="64" height="64" rx="18" fill="%230A84FF"/><path d="M18 42 31 15l15 34-13-9-15 2Z" fill="white"/></svg>' />
    <title>Fylura</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
