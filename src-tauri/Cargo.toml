[package]
name = "zen-canvas-tauri"
version = "0.1.40"
edition = "2021"
default-run = "zen-canvas"

[lib]
name = "zen_canvas_tauri"
crate-type = ["lib"]

[[bin]]
name = "zen-canvas"
path = "src/main.rs"
required-features = ["desktop-runtime"]

[[bin]]
name = "macos-native-preview-lifecycle"
path = "native-qa/macos_native_preview_lifecycle.rs"
required-features = ["native-qa"]

[[bin]]
name = "zb05-global-index-qa"
path = "native-qa/global_index_probe.rs"
required-features = ["native-qa"]

[features]
default = []
ai-debug = []
native-qa = []
desktop-runtime = [
    "tauri/wry",
    "tauri/compression",
    "tauri/common-controls-v6",
    "tauri/macos-private-api",
    "tauri/tray-icon",
    "tauri/image-png",
]
performance-test-tauri = ["tauri/test"]

[dependencies]
blake3 = "1"
csv = "1.4"
dirs = "5"
flate2 = "1"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png"] }
jwalk = "0.8.1"
jiff = { version = "=0.2.37", default-features = false, features = ["std", "tz-fat", "tzdb-bundle-always"] }
notify = "8"
r2d2 = "0.8"
r2d2_sqlite = { version = "0.34.0", features = ["bundled"] }
rusqlite = { version = "0.39", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zip = { version = "2", default-features = false, features = ["deflate"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
quick-xml = "0.41"
yaml-rust2 = "0.11.0"
sha2 = "0.10"
sysinfo = "0.32"
tauri = { version = "2", default-features = false, features = ["macos-private-api", "protocol-asset"] }
tauri-plugin-autostart = "2.5.1"
tauri-plugin-dialog = "2.7.1"
tauri-plugin-global-shortcut = "2"
tauri-plugin-single-instance = "2"
thiserror = "2"
time = { version = "0.3", features = ["formatting"] }
url = "2"
uuid = { version = "1", features = ["v4", "v7"] }
zen-canvas-native-host = { path = "native/host-provided" }
zen-canvas-preview-representation = { path = "native/preview-representation" }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3.6.3", default-features = false, features = ["windows-native"] }
windows-sys = { version = "0.61.2", features = [
    "Wdk_Foundation",
    "Wdk_Storage_FileSystem",
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Ioctl",
    "Win32_System_Pipes",
    "Win32_System_ProcessStatus",
    "Win32_System_Power",
    "Win32_System_Services",
    "Win32_System_SystemServices",
    "Win32_System_Threading",
    "Win32_System_WindowsProgramming",
] }

[target.'cfg(target_os = "windows")'.dev-dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_System_Memory"] }

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6.2"
fsevent-sys = "4.1.0"
keyring = { version = "3.6.3", default-features = false, features = ["apple-native"] }
objc2 = "0.6.4"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["NSApplication", "NSResponder", "NSView", "NSWorkspace"] }
objc2-core-foundation = { version = "0.3.2", default-features = false, features = ["CFRunLoop", "objc2"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = [
    "NSArray",
    "NSDate",
    "NSDictionary",
    "NSError",
    "NSFileCoordinator",
    "NSFileManager",
    "NSMetadata",
    "NSMetadataAttributes",
    "NSNotification",
    "NSObjCRuntime",
    "NSOperation",
    "NSPathUtilities",
    "NSPredicate",
    "NSProcessInfo",
    "NSRange",
    "NSRunLoop",
    "NSString",
    "NSValue",
    "NSURL",
    "block2",
    "objc2-core-foundation",
] }

[build-dependencies]
tauri-build = { version = "2", features = [] }
