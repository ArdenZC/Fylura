[package]
name = "fylura-windows-preview-handler"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "fylura-windows-preview-handler-real-host"
path = "src/real_host_registration.rs"
required-features = ["test-registration"]

[features]
default = []
test-observability = []
test-registration = []

[dependencies]
fylura-native-host = { path = "../host-provided" }
fylura-preview-representation = { path = "../preview-representation" }
fylura-windows-preview-registration = { path = "../windows-preview-registration" }
uuid = { version = "1", features = ["v4"] }
windows-core = "0.61.2"
windows = { version = "0.61.3", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_System_Com",
    "Win32_System_Ole",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Controls",
    "Win32_UI_Controls_RichEdit",
    "Win32_UI_Shell",
    "Win32_UI_Shell_PropertiesSystem",
    "Win32_UI_WindowsAndMessaging",
] }
windows-sys = { version = "0.61.2", features = [
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }
